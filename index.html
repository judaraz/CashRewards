<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a0f 0%,#1a0a1a 50%,#0f0a1a 100%);
            font-family:system-ui,sans-serif;
            min-height:100vh;
        }
        .glass{
            background:rgba(15,15,25,0.85);
            backdrop-filter:blur(12px);
            border:1px solid rgba(236,72,153,0.15);
        }
        .gradient-premium{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
        .gradient-unlocked{background:linear-gradient(135deg,#10b981,#059669)}
        
        .ad-popup{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:#1a1a2e;
            border-radius:20px;
            padding:30px;
            z-index:1000;
            border:1px solid #ec4899;
            text-align:center;
            display:none;
        }
        .ad-popup.show{display:block}
        .overlay{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.8);
            z-index:999;
            display:none;
        }
        .overlay.show{display:block}
    </style>
</head>
<body class="text-gray-100 p-4">

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>
    
    <!-- Ad Popup -->
    <div id="adPopup" class="ad-popup">
        <i class="fas fa-ad text-4xl text-pink-400 mb-4"></i>
        <h3 class="text-xl font-bold mb-2">Watch Ad</h3>
        <p id="adTimer" class="text-5xl font-bold text-pink-400 my-4">5</p>
        <p class="text-gray-400 text-sm">Watching ad...</p>
    </div>

    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <div class="glass rounded-2xl p-5 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
                    <i class="fas fa-crown text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Premium Content</h1>
            </div>
        </div>

        <!-- Content Grid -->
        <div id="contentGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="text-center text-gray-400 col-span-full py-8">Loading...</div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 glass px-5 py-3 rounded-xl opacity-0 transition-all z-50">
        <p id="toastMsg" class="text-sm"></p>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elements
        const contentGrid = document.getElementById('contentGrid');
        const overlay = document.getElementById('overlay');
        const adPopup = document.getElementById('adPopup');
        const adTimer = document.getElementById('adTimer');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let allFiles = [];
        let currentFileId = null;
        let currentRequired = 0;
        let timerInterval = null;

        // Show toast
        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        // 🔥 SIMPLE: Show ad popup and countdown
        function startAdCountdown(fileId, required) {
            currentFileId = fileId;
            currentRequired = required;
            
            // Show popup
            overlay.classList.add('show');
            adPopup.classList.add('show');
            
            // Try to show Adsgram ad (doesn't matter if it fails)
            if (window.Adsgram) {
                window.Adsgram.init({ blockId: "21145" }).show().catch(() => {});
            }
            
            // Start countdown
            let seconds = 5;
            adTimer.textContent = seconds;
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                seconds--;
                adTimer.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    
                    // Hide popup
                    overlay.classList.remove('show');
                    adPopup.classList.remove('show');
                    
                    // 🔥 COUNT +1 AND UPDATE
                    let watched = parseInt(localStorage.getItem(`ad_${currentFileId}`) || '0');
                    watched++;
                    localStorage.setItem(`ad_${currentFileId}`, watched);
                    
                    console.log(`Ad ${watched}/${currentRequired} for ${currentFileId}`);
                    
                    // Update button text
                    const btn = document.querySelector(`[data-file-id="${currentFileId}"]`);
                    if (btn) {
                        const btnText = btn.querySelector('.btn-text');
                        btnText.textContent = `Watch Ad (${watched}/${currentRequired})`;
                        btn.disabled = false;
                    }
                    
                    // Update badge
                    const badge = document.querySelector(`#badge-${currentFileId} .ad-count`);
                    if (badge) {
                        badge.textContent = `${watched}/${currentRequired}`;
                    }
                    
                    // Check if unlocked
                    if (watched >= currentRequired) {
                        unlockContent(currentFileId);
                        showToast('🎉 Content Unlocked!');
                    } else {
                        showToast(`📺 Progress: ${watched}/${currentRequired}`);
                    }
                }
            }, 1000);
        }

        // Unlock content
        function unlockContent(fileId) {
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;
            
            // Update badge
            const badge = document.getElementById(`badge-${fileId}`);
            if (badge) {
                badge.innerHTML = `<span class="gradient-unlocked px-2 py-1 rounded-lg text-xs"><i class="fas fa-check mr-1"></i>UNLOCKED</span>`;
            }
            
            // Update button
            const btnContainer = document.getElementById(`btn-${fileId}`);
            if (btnContainer) {
                btnContainer.innerHTML = `
                    <button onclick="window.open('${file.downloadUrl}', '_blank')" 
                            class="w-full py-2.5 rounded-lg text-white text-sm gradient-unlocked">
                        <i class="fas fa-unlock mr-2"></i>Access Now
                    </button>
                `;
            }
        }

        // Load files from Firebase
        async function loadFiles() {
            try {
                const q = query(collection(db, "files"), orderBy("createdAt", "desc"), limit(40));
                const snapshot = await getDocs(q);
                
                contentGrid.innerHTML = '';
                allFiles = [];
                
                snapshot.forEach(doc => {
                    allFiles.push({ id: doc.id, ...doc.data() });
                });
                
                allFiles.forEach(file => {
                    const required = file.requiredAds || 5;
                    const watched = parseInt(localStorage.getItem(`ad_${file.id}`) || '0');
                    const unlocked = watched >= required;
                    
                    const card = document.createElement('div');
                    card.className = 'glass rounded-xl overflow-hidden';
                    card.innerHTML = `
                        <div class="relative aspect-[3/4]">
                            <img src="${file.thumbnailUrl}" class="w-full h-full object-cover" 
                                 onerror="this.src='https://placehold.co/400x600/1a1a2e/ec4899?text=Premium'">
                            <div class="absolute top-2 right-2" id="badge-${file.id}">
                                ${!unlocked ? `
                                    <span class="bg-black/70 px-2 py-1 rounded-lg text-xs border border-pink-500/40">
                                        <i class="fas fa-lock mr-1"></i><span class="ad-count">${watched}/${required}</span>
                                    </span>
                                ` : `
                                    <span class="gradient-unlocked px-2 py-1 rounded-lg text-xs">
                                        <i class="fas fa-check mr-1"></i>UNLOCKED
                                    </span>
                                `}
                            </div>
                            <div class="absolute top-2 left-2">
                                <span class="bg-pink-500/90 px-2 py-1 rounded-lg text-[10px]">
                                    <i class="fas fa-crown mr-1"></i>PREMIUM
                                </span>
                            </div>
                            <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black">
                                <h3 class="font-bold text-sm">${file.title}</h3>
                            </div>
                        </div>
                        <div class="p-3">
                            <p class="text-gray-400 text-xs mb-3 line-clamp-2">${file.description}</p>
                            <div id="btn-${file.id}">
                                ${!unlocked ? `
                                    <button data-file-id="${file.id}" data-required="${required}" 
                                            class="unlock-btn w-full py-2.5 rounded-lg text-white text-sm gradient-premium">
                                        <i class="fas fa-play-circle mr-2"></i>
                                        <span class="btn-text">Watch Ad (${watched}/${required})</span>
                                    </button>
                                ` : `
                                    <button onclick="window.open('${file.downloadUrl}', '_blank')" 
                                            class="w-full py-2.5 rounded-lg text-white text-sm gradient-unlocked">
                                        <i class="fas fa-unlock mr-2"></i>Access Now
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                    contentGrid.appendChild(card);
                });
                
                // Add click listeners
                document.querySelectorAll('.unlock-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (btn.disabled) return;
                        
                        btn.disabled = true;
                        const fileId = btn.dataset.fileId;
                        const required = parseInt(btn.dataset.required);
                        
                        startAdCountdown(fileId, required);
                    });
                });
                
            } catch (error) {
                console.error('Error loading:', error);
                contentGrid.innerHTML = '<div class="col-span-full text-center py-8 text-red-400">Failed to load content</div>';
            }
        }

        // Load Adsgram
        const script = document.createElement('script');
        script.src = 'https://sad.adsgram.ai/js/sad.min.js';
        script.onload = () => console.log('Adsgram loaded');
        document.head.appendChild(script);

        // Start
        loadFiles();
    </script>
</body>
</html>
