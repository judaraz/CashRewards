<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Access</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a0f 0%,#1a0a1a 50%,#0f0a1a 100%);
            font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        }
        
        @keyframes softGlow{
            0%,100%{box-shadow:0 0 20px rgba(236,72,153,0.2)}
            50%{box-shadow:0 0 30px rgba(236,72,153,0.4)}
        }
        
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(10px)}
            to{opacity:1;transform:translateY(0)}
        }
        
        .animate-fadeUp{animation:fadeUp .4s ease-out forwards}
        .glow-pulse{animation:softGlow 2s ease-in-out infinite}
        
        .glass{
            background:rgba(15,15,25,0.85);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(236,72,153,0.15);
        }
        
        .gradient-premium{
            background:linear-gradient(135deg,#ec4899,#8b5cf6);
        }
        
        .gradient-unlocked{
            background:linear-gradient(135deg,#10b981,#059669);
        }
        
        .slider-wrapper{
            display:flex;
            transition:transform .5s cubic-bezier(0.4,0,0.2,1);
            will-change:transform;
        }
        .slider-item{min-width:100%}
        .slider-dot{
            width:8px;
            height:8px;
            border-radius:50%;
            background:rgba(255,255,255,0.3);
            transition:all .3s;
            cursor:pointer;
        }
        .slider-dot.active{
            width:24px;
            border-radius:12px;
            background:linear-gradient(90deg,#ec4899,#8b5cf6);
        }
        
        .card-hover{
            transition:transform .3s,box-shadow .3s;
            will-change:transform;
        }
        .card-hover:hover{
            transform:translateY(-4px);
            box-shadow:0 20px 40px rgba(236,72,153,0.15);
        }
        
        .skeleton{
            background:linear-gradient(90deg,#1a1a2a 25%,#2a2a3a 50%,#1a1a2a 75%);
            background-size:200% 100%;
            animation:shimmer 1.2s infinite;
        }
        @keyframes shimmer{
            0%{background-position:200% 0}
            100%{background-position:-200% 0}
        }
        
        .badge-premium{
            background:linear-gradient(135deg,#ec4899,#8b5cf6);
            clip-path:polygon(0 0,100% 0,90% 100%,0 100%);
        }
        
        .badge-hot{
            background:linear-gradient(90deg,#ef4444,#ec4899);
        }
        
        img{content-visibility:auto}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:#0a0a0f}
        ::-webkit-scrollbar-thumb{background:#ec4899;border-radius:10px}
        
        button:disabled{
            opacity:0.6;
            cursor:not-allowed;
        }
        
        /* Progress bar */
        .progress-bar{
            height:3px;
            background:rgba(236,72,153,0.2);
            border-radius:3px;
            overflow:hidden;
        }
        .progress-fill{
            height:100%;
            background:linear-gradient(90deg,#ec4899,#8b5cf6);
            transition:width 0.1s linear;
        }

        /* Countdown animation */
        .countdown-pulse {
            animation: countdownPulse 1s ease-in-out infinite;
        }
        
        @keyframes countdownPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Ad container styles */
        .ad-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            max-width: 90%;
            width: 400px;
            background: rgba(0,0,0,0.95);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(236,72,153,0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: none;
        }
        
        .ad-container.show {
            display: block;
        }
        
        .ad-content {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
            backdrop-filter: blur(4px);
        }
        
        .ad-overlay.show {
            display: block;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            databaseURL: "https://visit-1f400-default-rtdb.firebaseio.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Configuration
        const AD_WAIT_TIME = 5; // Seconds user must wait for ad
        const COUNTDOWN_TIME = 10; // Total countdown seconds
        
        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const noResultsMessage = document.getElementById('no-results');
        const adContainer = document.getElementById('adContainer');
        const adOverlay = document.getElementById('adOverlay');
        const adContent = document.getElementById('adContent');
        const closeAdBtn = document.getElementById('closeAdBtn');

        let sliderInterval, currentSlide = 0, allFiles = [];
        let activeTimers = new Map();
        let AdController = null;
        let currentAdResolver = null;
        let adStartTime = null;
        let adCompletedSuccessfully = false;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            msg.textContent = message;
            icon.className = type === 'error' ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-pink-400';
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2500);
        }

        // Initialize Adsgram
        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                AdController = window.Adsgram.init({ blockId: "21145" });
                console.log("✅ Adsgram initialized");
                return true;
            }
            console.log("⚠️ Adsgram not loaded - using fallback");
            return false;
        }

        // 🔥 IMPROVED: Reliable ad display with time verification
        async function showAdvertisement() {
            return new Promise((resolve) => {
                adCompletedSuccessfully = false;
                adStartTime = Date.now();
                
                // Show overlay to prevent interaction
                adOverlay.classList.add('show');
                
                // Create manual timer that ensures minimum view time
                const minViewTime = AD_WAIT_TIME * 1000;
                let adTimerCompleted = false;
                let displayInterval = null;
                
                // Manual timer (always reliable)
                const manualTimer = setTimeout(() => {
                    adTimerCompleted = true;
                    console.log("✅ Manual ad timer completed");
                    
                    if (!adCompletedSuccessfully) {
                        adCompletedSuccessfully = true;
                        if (displayInterval) clearInterval(displayInterval);
                        hideAdContainer();
                        resolve(true);
                    }
                }, minViewTime);
                
                // Try to show network ad
                if (AdController) {
                    AdController.show()
                        .then(() => {
                            console.log("✅ Adsgram callback received");
                            
                            // Check if minimum time elapsed
                            const timeElapsed = Date.now() - adStartTime;
                            if (timeElapsed >= minViewTime) {
                                if (!adCompletedSuccessfully) {
                                    adCompletedSuccessfully = true;
                                    clearTimeout(manualTimer);
                                    if (displayInterval) clearInterval(displayInterval);
                                    hideAdContainer();
                                    resolve(true);
                                }
                            } else {
                                // Wait remaining time
                                const remaining = minViewTime - timeElapsed;
                                setTimeout(() => {
                                    if (!adCompletedSuccessfully) {
                                        adCompletedSuccessfully = true;
                                        clearTimeout(manualTimer);
                                        if (displayInterval) clearInterval(displayInterval);
                                        hideAdContainer();
                                        resolve(true);
                                    }
                                }, remaining);
                            }
                        })
                        .catch((error) => {
                            console.log("❌ Adsgram failed:", error);
                            // Manual timer will handle completion
                        });
                }
                
                // Show fallback ad UI with countdown
                displayInterval = showFallbackAd();
                
                // Cleanup function
                currentAdResolver = (forced) => {
                    clearTimeout(manualTimer);
                    if (displayInterval) clearInterval(displayInterval);
                    if (!adCompletedSuccessfully) {
                        adCompletedSuccessfully = true;
                        hideAdContainer();
                        resolve(forced || false);
                    }
                };
            });
        }

        function showFallbackAd() {
            adContent.innerHTML = `
                <div class="text-center w-full">
                    <div class="mb-4">
                        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-pink-500 to-purple-600 rounded-2xl flex items-center justify-center mb-3">
                            <i class="fas fa-ad text-3xl text-white"></i>
                        </div>
                        <p class="text-white font-semibold text-lg">Supporting Creators</p>
                        <p class="text-xs text-gray-400 mt-1">Please wait for the advertisement to complete</p>
                    </div>
                    <div class="bg-gradient-to-r from-pink-500/20 to-purple-600/20 rounded-xl p-4 border border-pink-500/30">
                        <div class="flex items-center justify-center gap-3">
                            <div class="flex gap-1">
                                <div class="w-2 h-2 bg-pink-500 rounded-full animate-pulse"></div>
                                <div class="w-2 h-2 bg-pink-500 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
                                <div class="w-2 h-2 bg-pink-500 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
                            </div>
                            <span class="text-sm text-gray-300">Please wait </span>
                            <span id="adTimerDisplay" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">${AD_WAIT_TIME}</span>
                            <span class="text-sm text-gray-300">seconds</span>
                            <div class="flex gap-1">
                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></div>
                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
                            </div>
                        </div>
                        <div class="mt-3 progress-bar">
                            <div id="adProgressFill" class="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-3">
                        <i class="fas fa-lock mr-1"></i>Content unlocks after advertisement
                    </p>
                </div>
            `;
            
            adContainer.classList.add('show');
            
            // Update timer display and progress bar
            let secondsLeft = AD_WAIT_TIME;
            const timerDisplay = document.getElementById('adTimerDisplay');
            const progressFill = document.getElementById('adProgressFill');
            
            return setInterval(() => {
                secondsLeft--;
                if (timerDisplay && secondsLeft >= 0) {
                    timerDisplay.textContent = secondsLeft;
                    if (progressFill) {
                        const progress = ((AD_WAIT_TIME - secondsLeft) / AD_WAIT_TIME) * 100;
                        progressFill.style.width = progress + '%';
                    }
                }
                if (secondsLeft <= 0) {
                    clearInterval(this);
                }
            }, 1000);
        }

        function hideAdContainer() {
            adContainer.classList.remove('show');
            adOverlay.classList.remove('show');
            adContent.innerHTML = '';
            if (currentAdResolver) {
                currentAdResolver = null;
            }
        }

        // Handle manual close attempt (anti-cheat)
        closeAdBtn.addEventListener('click', () => {
            if (!adStartTime) return;
            
            const timeElapsed = Date.now() - adStartTime;
            const minRequired = AD_WAIT_TIME * 1000;
            
            if (timeElapsed < minRequired) {
                const remaining = Math.ceil((minRequired - timeElapsed) / 1000);
                showToast(`⏱️ Please wait ${remaining} more seconds`, 'error');
                
                // Shake animation on close button
                closeAdBtn.style.animation = 'shake 0.5s';
                setTimeout(() => closeAdBtn.style.animation = '', 500);
                return; // Prevent early closing
            }
            
            if (currentAdResolver) {
                currentAdResolver(false);
                currentAdResolver = null;
            }
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        async function loadAllData() {
            try {
                const [slidersSnap, filesSnap] = await Promise.all([
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(8))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(40)))
                ]);
                
                renderSliders(slidersSnap);
                renderFiles(filesSnap);
            } catch (e) {
                console.error("Load error:", e);
                showErrorStates();
            }
        }

        function renderSliders(snapshot) {
            sliderWrapper.innerHTML = '';
            sliderDotsContainer.innerHTML = '';
            const slides = [];
            snapshot.forEach(d => slides.push(d.data()));
            
            if (slides.length) {
                slides.forEach((s, i) => {
                    const el = document.createElement('div');
                    el.className = 'slider-item';
                    el.innerHTML = s.linkUrl ? 
                        `<a href="${s.linkUrl}" target="_blank"><img src="${s.imageUrl}" class="w-full h-full object-cover" loading="eager" onerror="this.src='https://placehold.co/1200x400/1a1a2e/ec4899?text=Premium'"></a>` :
                        `<img src="${s.imageUrl}" class="w-full h-full object-cover" loading="eager" onerror="this.src='https://placehold.co/1200x400/1a1a2e/ec4899?text=Premium'">`;
                    sliderWrapper.appendChild(el);
                    
                    const dot = document.createElement('div');
                    dot.className = 'slider-dot';
                    dot.dataset.index = i;
                    sliderDotsContainer.appendChild(dot);
                });
                setupSlider(slides.length);
            } else {
                sliderWrapper.innerHTML = '<div class="slider-item flex items-center justify-center bg-black/50"><p class="text-gray-500">No featured content</p></div>';
            }
        }

        function renderFiles(snapshot) {
            filesGrid.innerHTML = '';
            allFiles = [];
            
            if (snapshot.empty) {
                filesGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">No content available</p>';
                return;
            }
            
            snapshot.forEach(d => allFiles.push({ id: d.id, ...d.data() }));
            
            const fragment = document.createDocumentFragment();
            
            allFiles.forEach(f => {
                const required = f.requiredAds || 5;
                const watched = parseInt(localStorage.getItem(`adCount_${f.id}`) || 0);
                const unlocked = watched >= required;
                
                // Debug log for localStorage
                console.log(`📊 File ${f.id}: ${watched}/${required} ads watched`);
                
                const card = document.createElement('div');
                card.className = 'file-card group glass rounded-xl md:rounded-2xl overflow-hidden card-hover border border-pink-500/20';
                card.dataset.title = f.title.toLowerCase();
                card.dataset.description = f.description.toLowerCase();
                card.dataset.fileId = f.id;
                
                card.innerHTML = `
                    <div class="relative aspect-[4/5] md:aspect-video overflow-hidden">
                        <img src="${f.thumbnailUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='https://placehold.co/400x600/1a1a2e/ec4899?text=Premium'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                        
                        <div class="ad-badge absolute top-2 right-2" id="badge-${f.id}">
                            ${!unlocked ? `
                                <span class="bg-black/70 backdrop-blur-sm px-2 py-1 rounded-lg text-xs font-bold border border-pink-500/40 text-pink-300">
                                    <i class="fas fa-lock mr-1"></i><span class="ad-count">${watched}/${required}</span>
                                </span>
                            ` : `
                                <span class="gradient-unlocked px-2 py-1 rounded-lg text-xs font-bold shadow-lg">
                                    <i class="fas fa-check mr-1"></i>UNLOCKED
                                </span>
                            `}
                        </div>
                        
                        <div class="absolute top-2 left-2">
                            <span class="bg-gradient-to-r from-pink-500/90 to-purple-600/90 backdrop-blur-sm px-2 py-1 rounded-lg text-[10px] font-bold">
                                <i class="fas fa-crown mr-1"></i>PREMIUM
                            </span>
                        </div>
                        
                        <div class="absolute bottom-0 left-0 right-0 p-3">
                            <h3 class="font-bold text-sm md:text-base text-white line-clamp-1">${f.title}</h3>
                        </div>
                    </div>
                    
                    <div class="p-3">
                        <p class="text-gray-400 text-xs line-clamp-2 mb-3">${f.description}</p>
                        
                        <div class="button-container" id="btn-container-${f.id}">
                            ${!unlocked ? `
                                <div class="space-y-2">
                                    <button data-file-id="${f.id}" data-required="${required}" 
                                            class="unlock-btn w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-premium hover:opacity-90 transition flex items-center justify-center gap-2">
                                        <i class="fas fa-play-circle"></i>
                                        <span class="btn-text">Unlock (${watched}/${required})</span>
                                    </button>
                                    <div class="progress-container hidden">
                                        <div class="progress-bar">
                                            <div class="progress-fill" style="width:0%"></div>
                                        </div>
                                        <p class="timer-text text-center text-xs text-gray-400 mt-1">
                                            <span class="countdown-pulse">⏳</span> Wait <span class="seconds font-bold text-pink-400">${COUNTDOWN_TIME}</span>s...
                                        </p>
                                    </div>
                                </div>
                            ` : `
                                <button data-file-url="${f.downloadUrl}" 
                                        class="open-btn w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-unlocked hover:opacity-90 transition flex items-center justify-center gap-2 glow-pulse">
                                    <i class="fas fa-unlock"></i>
                                    <span>Access Now</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            
            filesGrid.appendChild(fragment);
        }

        function showErrorStates() {
            sliderWrapper.innerHTML = '<div class="slider-item flex items-center justify-center bg-black/50"><p class="text-red-400">Failed to load</p></div>';
            filesGrid.innerHTML = '<p class="col-span-full text-center text-red-400 py-8">Failed to load content</p>';
        }

        function setupSlider(count) {
            if (count <= 1) {
                if(count === 1) document.querySelector('.slider-dot')?.classList.add('active');
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            const goTo = (idx) => {
                currentSlide = (idx + count) % count;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            };
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goTo(currentSlide + 1), 3500);
            dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
            goTo(0);
        }

        // 🔥 FIXED: Countdown now starts AFTER ad completion
        function startCountdown(btn, fileId, required) {
            const container = btn.closest('.space-y-2');
            const progressContainer = container.querySelector('.progress-container');
            const progressFill = progressContainer.querySelector('.progress-fill');
            const secondsSpan = progressContainer.querySelector('.seconds');
            const btnText = btn.querySelector('.btn-text');
            
            btn.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            
            let secondsLeft = COUNTDOWN_TIME;
            const totalSeconds = COUNTDOWN_TIME;
            
            const timer = setInterval(() => {
                secondsLeft--;
                const progress = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
                progressFill.style.width = progress + '%';
                secondsSpan.textContent = secondsLeft;
                
                if (secondsLeft <= 0) {
                    clearInterval(timer);
                    activeTimers.delete(fileId);
                    
                    // Count the ad view (only after successful completion)
                    let watched = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
                    watched++;
                    localStorage.setItem(`adCount_${fileId}`, watched);
                    
                    console.log(`✅ Ad counted for ${fileId}: ${watched}/${required}`);
                    
                    if (watched >= required) {
                        showToast('🎉 Content Unlocked!');
                        updateCardToUnlocked(fileId);
                    } else {
                        btn.classList.remove('hidden');
                        progressContainer.classList.add('hidden');
                        btnText.textContent = `Unlock (${watched}/${required})`;
                        btn.disabled = false;
                        progressFill.style.width = '0%';
                        secondsSpan.textContent = COUNTDOWN_TIME;
                        
                        const badgeSpan = document.querySelector(`#badge-${fileId} .ad-count`);
                        if (badgeSpan) {
                            badgeSpan.textContent = `${watched}/${required}`;
                        }
                        
                        showToast(`📺 Progress: ${watched}/${required} ads`);
                    }
                }
            }, 1000);
            
            activeTimers.set(fileId, timer);
        }

        function updateCardToUnlocked(fileId) {
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;
            
            const badgeDiv = document.getElementById(`badge-${fileId}`);
            if (badgeDiv) {
                badgeDiv.innerHTML = `
                    <span class="gradient-unlocked px-2 py-1 rounded-lg text-xs font-bold shadow-lg">
                        <i class="fas fa-check mr-1"></i>UNLOCKED
                    </span>
                `;
            }
            
            const btnContainer = document.getElementById(`btn-container-${fileId}`);
            if (btnContainer) {
                btnContainer.innerHTML = `
                    <button data-file-url="${file.downloadUrl}" 
                            class="open-btn w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-unlocked hover:opacity-90 transition flex items-center justify-center gap-2 glow-pulse">
                        <i class="fas fa-unlock"></i>
                        <span>Access Now</span>
                    </button>
                `;
            }
        }

        // 🔥 FIXED: Sequential flow - Ad first, then countdown
        async function handleUnlock(btn) {
            if (btn.disabled) return;
            
            const fileId = btn.dataset.fileId;
            const required = parseInt(btn.dataset.required) || 5;
            
            if (activeTimers.has(fileId)) {
                showToast('Already counting down...', 'error');
                return;
            }
            
            btn.disabled = true;
            
            // STEP 1: Show and verify ad completion FIRST
            showToast('📺 Loading advertisement...');
            const adSuccess = await showAdvertisement();
            
            if (!adSuccess) {
                showToast('❌ Ad not completed. Please try again.', 'error');
                btn.disabled = false;
                return;
            }
            
            // STEP 2: Only after successful ad, start countdown
            showToast('✅ Ad completed! Continue waiting...');
            startCountdown(btn, fileId, required);
        }

        function handleOpen(btn) {
            const url = btn.dataset.fileUrl;
            if (url) {
                showToast('🚀 Opening content...');
                window.open(url, '_blank');
            }
        }

        function handleClick(e) {
            const unlock = e.target.closest('.unlock-btn');
            const open = e.target.closest('.open-btn');
            
            if (unlock) {
                e.preventDefault();
                e.stopPropagation();
                handleUnlock(unlock);
            } else if (open) {
                e.preventDefault();
                e.stopPropagation();
                handleOpen(open);
            }
        }

        function handleSearch() {
            const term = searchInput.value.toLowerCase();
            let visible = 0;
            
            document.querySelectorAll('.file-card').forEach(card => {
                const title = card.dataset.title || '';
                const desc = card.dataset.description || '';
                const show = title.includes(term) || desc.includes(term);
                card.style.display = show ? 'block' : 'none';
                if (show) visible++;
            });
            
            noResultsMessage.classList.toggle('hidden', visible > 0);
        }

        // Debug tools
        window.debugStorage = function() {
            console.log("=== LocalStorage Debug ===");
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('adCount_')) {
                    console.log(`${key}: ${localStorage.getItem(key)}`);
                }
            }
        };
        
        window.resetAdCounts = function() {
            allFiles.forEach(f => {
                localStorage.removeItem(`adCount_${f.id}`);
            });
            console.log("✅ All ad counts reset");
            location.reload();
        };

        // Initialize
        loadAllData();
        
        // Try to initialize ads after a short delay
        setTimeout(() => {
            initAdsgram();
        }, 1000);
        
        filesGrid.addEventListener('click', handleClick);
        searchInput.addEventListener('input', handleSearch);
        searchBtn.addEventListener('click', handleSearch);
        
        // Keyboard shortcut for search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>
