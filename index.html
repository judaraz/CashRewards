<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Content Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Adsgram SDK -->
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Sexy animations */
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.3); }
            50% { box-shadow: 0 0 40px rgba(236, 72, 153, 0.6); }
        }
        
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes hotReveal {
            0% { opacity: 0; filter: blur(10px); }
            100% { opacity: 1; filter: blur(0); }
        }
        
        .float-in { animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hot-reveal { animation: hotReveal 0.8s ease-out forwards; }
        .glow-pulse { animation: glowPulse 2s ease-in-out infinite; }
        
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ec4899, #8b5cf6); border-radius: 10px; }
        
        /* Glass morphism */
        .glass-card {
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(236, 72, 153, 0.2);
        }
        
        /* Hot gradient backgrounds */
        .hot-gradient {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a0a1a 100%);
        }
        
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        
        .slider-container { position: relative; overflow: hidden; border-radius: 24px; }
        .slider-wrapper { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slider-item { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: all 0.3s; }
        .slider-dot.active { width: 24px; border-radius: 12px; background: linear-gradient(90deg, #ec4899, #8b5cf6); }
        
        /* Premium badges */
        .premium-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }
        
        /* Hot tag */
        .hot-tag {
            background: linear-gradient(90deg, #ef4444, #ec4899);
            animation: glowPulse 1.5s infinite;
        }
    </style>
</head>
<body class="hot-gradient min-h-screen text-gray-100">

    <div id="app" class="container mx-auto px-4 py-6 max-w-7xl">
        
        <!-- Premium Header -->

    <!-- Sexy Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 glass-card px-6 py-4 rounded-2xl shadow-2xl opacity-0 transform translate-y-4 transition-all duration-500 z-50 border border-pink-500/50">

    <!-- Adsgram SDK -->
    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            databaseURL: "https://visit-1f400-default-rtdb.firebaseio.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('no-results');

        let sliderInterval;
        let currentSlide = 0;
        let timerDuration = 10;
        let AdController = null;
        let allFiles = [];

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const icon = toast.querySelector('i');
            
            toastMessage.textContent = message;
            
            if (type === 'error') {
                icon.className = 'fas fa-exclamation-circle text-red-400 text-xl';
                toast.classList.add('border-red-500/50');
            } else {
                icon.className = 'fas fa-check-circle text-pink-400 text-xl';
                toast.classList.add('border-pink-500/50');
            }
            
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                AdController = window.Adsgram.init({ blockId: "21145" });
                console.log("Adsgram initialized");
            } else {
                setTimeout(initAdsgram, 500);
            }
        }

        async function loadAllData() {
            try {
                const [settingsSnap, slidersSnap, filesSnap] = await Promise.all([
                    getDoc(doc(db, "settings", "general")),
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(10))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(50)))
                ]);
                
                if (settingsSnap.exists()) {
                    timerDuration = settingsSnap.data().timerDuration || 10;
                }
                
                renderSliders(slidersSnap);
                renderFiles(filesSnap);
                
            } catch (error) {
                console.error("Error loading data:", error);
                showErrorStates();
            }
        }

        function renderSliders(sliderSnapshot) {
            sliderWrapper.innerHTML = '';
            sliderDotsContainer.innerHTML = '';
            const slides = [];
            sliderSnapshot.forEach(doc => slides.push(doc.data()));
            
            if (slides.length > 0) {
                slides.forEach((slide, index) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = 'slider-item relative';
                    const imageHTML = `<img src="${slide.imageUrl}" class="w-full h-full object-cover" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/1280x400/1a1a2e/ec4899?text=Premium+Content';">`;
                    slideEl.innerHTML = slide.linkUrl ? `<a href="${slide.linkUrl}" target="_blank" rel="noopener noreferrer">${imageHTML}</a>` : imageHTML;
                    
                    // Add overlay gradient
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent';
                    slideEl.appendChild(overlay);
                    
                    sliderWrapper.appendChild(slideEl);
                    
                    const dotEl = document.createElement('div');
                    dotEl.className = 'slider-dot';
                    dotEl.dataset.index = index;
                    sliderDotsContainer.appendChild(dotEl);
                });
                setupSlider(slides.length);
            } else {
                sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-gradient-to-br from-gray-900 to-black"><p class="text-gray-400">No featured content</p></div>`;
            }
        }

        function renderFiles(filesSnapshot) {
            filesGrid.innerHTML = '';
            allFiles = [];
            
            if (filesSnapshot.empty) {
                filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12">No premium content available yet.</p>`;
                return;
            }
            
            filesSnapshot.forEach(doc => allFiles.push({ id: doc.id, ...doc.data() }));
            
            const fragment = document.createDocumentFragment();
            
            allFiles.forEach((file, index) => {
                const card = document.createElement('div');
                card.className = 'file-card group relative glass-card rounded-2xl overflow-hidden transform hover:scale-[1.02] transition-all duration-300 border border-pink-500/20 hover:border-pink-500/50 hover:shadow-2xl hover:shadow-pink-500/20';
                card.dataset.title = file.title.toLowerCase();
                card.dataset.description = file.description.toLowerCase();
                card.style.animationDelay = `${index * 0.05}s`;
                card.classList.add('float-in');
                
                const requiredAds = file.requiredAds || 5;
                const adCount = parseInt(localStorage.getItem(`adCount_${file.id}`) || 0);
                const isUnlocked = adCount >= requiredAds;
                
                card.innerHTML = `
                    <div class="relative aspect-video overflow-hidden">
                        <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x225/1a1a2e/ec4899?text=Premium';">
                        <div class="absolute inset-0 card-overlay"></div>
                        
                        ${!isUnlocked ? `
                            <div class="absolute top-3 right-3">
                                <span class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold border border-pink-500/50 text-pink-300">
                                    <i class="fas fa-lock mr-1"></i> ${adCount}/${requiredAds}
                                </span>
                            </div>
                        ` : `
                            <div class="absolute top-3 right-3">
                                <span class="bg-gradient-to-r from-green-500 to-emerald-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg">
                                    <i class="fas fa-unlock mr-1"></i> UNLOCKED
                                </span>
                            </div>
                        `}
                        
                        <div class="absolute top-3 left-3">
                            <span class="bg-gradient-to-r from-pink-500 to-purple-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg">
                                <i class="fas fa-crown mr-1"></i> PREMIUM
                            </span>
                        </div>
                    </div>
                    
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-white mb-2 line-clamp-1 group-hover:text-pink-300 transition-colors">
                            ${file.title}
                        </h3>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">
                            ${file.description}
                        </p>
                        
                        <div class="space-y-2">
                            ${!isUnlocked ? `
                                <button data-id="${file.id}" data-required-ads="${requiredAds}" 
                                        class="watch-ad-btn w-full py-3 px-4 rounded-xl text-white font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 shadow-lg hover:shadow-pink-500/30 transform hover:-translate-y-0.5">
                                    <i class="fas fa-play-circle"></i>
                                    <span>Watch Ad to Unlock</span>
                                </button>
                            ` : ''}
                            
                            ${isUnlocked ? `
                                <button data-url="${file.downloadUrl}" 
                                        class="open-btn w-full py-3 px-4 rounded-xl text-white font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 shadow-lg hover:shadow-green-500/30 transform hover:-translate-y-0.5 glow-pulse">
                                    <i class="fas fa-external-link-alt"></i>
                                    <span>Access Content</span>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            
            filesGrid.appendChild(fragment);
        }

        function showErrorStates() {
            sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-gradient-to-br from-red-900/50 to-black"><p class="text-red-400">Failed to load content</p></div>`;
            filesGrid.innerHTML = `<p class="col-span-full text-center text-red-400 py-12">Failed to load premium content. Please refresh.</p>`;
        }

        function setupSlider(slideCount) {
            if (slideCount <= 1) {
                if(slideCount === 1) document.querySelector('.slider-dot').classList.add('active');
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            function goToSlide(slideIndex) {
                currentSlide = (slideIndex + slideCount) % slideCount;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 4000);
            dots.forEach(dot => dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index))));
            goToSlide(0);
        }

        function updateFileCardButtons(fileId) {
            const fileCard = document.querySelector(`[data-id="${fileId}"]`).closest('.file-card');
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;
            
            const requiredAds = file.requiredAds || 5;
            const adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            const isUnlocked = adCount >= requiredAds;
            
            const buttonContainer = fileCard.querySelector('.space-y-2');
            const badgeContainer = fileCard.querySelector('.absolute.top-3.right-3');
            
            // Update badge
            if (!isUnlocked) {
                badgeContainer.innerHTML = `
                    <span class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold border border-pink-500/50 text-pink-300">
                        <i class="fas fa-lock mr-1"></i> ${adCount}/${requiredAds}
                    </span>
                `;
            } else {
                badgeContainer.innerHTML = `
                    <span class="bg-gradient-to-r from-green-500 to-emerald-600 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg">
                        <i class="fas fa-unlock mr-1"></i> UNLOCKED
                    </span>
                `;
            }
            
            // Update buttons
            buttonContainer.innerHTML = `
                ${!isUnlocked ? `
                    <button data-id="${fileId}" data-required-ads="${requiredAds}" 
                            class="watch-ad-btn w-full py-3 px-4 rounded-xl text-white font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 shadow-lg hover:shadow-pink-500/30 transform hover:-translate-y-0.5">
                        <i class="fas fa-play-circle"></i>
                        <span>Watch Ad to Unlock</span>
                    </button>
                ` : ''}
                ${isUnlocked ? `
                    <button data-url="${file.downloadUrl}" 
                            class="open-btn w-full py-3 px-4 rounded-xl text-white font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 shadow-lg hover:shadow-green-500/30 transform hover:-translate-y-0.5 glow-pulse">
                        <i class="fas fa-external-link-alt"></i>
                        <span>Access Content</span>
                    </button>
                ` : ''}
            `;
        }

        async function handleWatchAdClick(button) {
            if (button.disabled) return;
            
            button.disabled = true;
            const fileId = button.dataset.id;
            const requiredAds = parseInt(button.dataset.requiredAds) || 5;
            let adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            const buttonSpan = button.querySelector('span');
            const originalText = buttonSpan.textContent;
            
            try {
                buttonSpan.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Loading...';
                
                if (AdController) {
                    await AdController.show();
                    adCount++;
                    localStorage.setItem(`adCount_${fileId}`, adCount);
                } else {
                    adCount++;
                    localStorage.setItem(`adCount_${fileId}`, adCount);
                }
                
                if (adCount >= requiredAds) {
                    showToast('🎉 Content unlocked! Enjoy!');
                    updateFileCardButtons(fileId);
                    return;
                }
                
                showToast(`📺 ${adCount}/${requiredAds} ads watched`);
                
                let countdown = timerDuration;
                buttonSpan.textContent = `Wait ${countdown}s`;
                
                const timerInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        buttonSpan.textContent = `Wait ${countdown}s`;
                    } else {
                        clearInterval(timerInterval);
                        button.disabled = false;
                        buttonSpan.innerHTML = '<i class="fas fa-play-circle mr-2"></i>Watch Ad to Unlock';
                    }
                }, 1000);
                
            } catch (err) {
                console.error("Ad error:", err);
                showToast('Could not load ad. Try again.', 'error');
                button.disabled = false;
                buttonSpan.innerHTML = '<i class="fas fa-play-circle mr-2"></i>Watch Ad to Unlock';
            }
        }

        function handleOpenClick(button) {
            const downloadUrl = button.dataset.url;
            if (downloadUrl) {
                showToast('🚀 Accessing premium content...');
                window.open(downloadUrl, '_blank');
            }
        }

        function handleButtonClick(e) {
            const watchAdBtn = e.target.closest('.watch-ad-btn');
            const openBtn = e.target.closest('.open-btn');
            
            if (watchAdBtn) {
                handleWatchAdClick(watchAdBtn);
            } else if (openBtn) {
                handleOpenClick(openBtn);
            }
        }

        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const fileCards = document.querySelectorAll('.file-card');
            let visibleCount = 0;
            
            fileCards.forEach(card => {
                const title = card.dataset.title;
                const description = card.dataset.description;
                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            noResultsMessage.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // Initialize everything
        loadAllData();
        initAdsgram();

        // Event listeners
        filesGrid.addEventListener('click', handleButtonClick);
        searchInput.addEventListener('input', handleSearch);
        
        // Enter key for search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>
