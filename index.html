<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a0f 0%,#1a0a1a 50%,#0f0a1a 100%);
            font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(10px)}
            to{opacity:1;transform:translateY(0)}
        }
        .animate-fadeUp{animation:fadeUp .4s ease-out forwards}
        .glass{
            background:rgba(15,15,25,0.85);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(236,72,153,0.15);
        }
        .gradient-premium{background:linear-gradient(135deg,#ec4899,#8b5cf6);}
        .gradient-unlocked{background:linear-gradient(135deg,#10b981,#059669);}
        .slider-wrapper{display:flex;transition:transform .5s;will-change:transform;}
        .slider-item{min-width:100%}
        .slider-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all .3s;cursor:pointer;}
        .slider-dot.active{width:24px;border-radius:12px;background:linear-gradient(90deg,#ec4899,#8b5cf6);}
        .card-hover{transition:transform .3s,box-shadow .3s;}
        .card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(236,72,153,0.15);}
        .skeleton{background:linear-gradient(90deg,#1a1a2a 25%,#2a2a3a 50%,#1a1a2a 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .badge-premium{background:linear-gradient(135deg,#ec4899,#8b5cf6);clip-path:polygon(0 0,100% 0,90% 100%,0 100%);}
        .badge-hot{background:linear-gradient(90deg,#ef4444,#ec4899);}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:#0a0a0f}
        ::-webkit-scrollbar-thumb{background:#ec4899;border-radius:10px}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .progress-ring{width:20px;height:20px;border:2px solid rgba(255,255,255,0.2);border-top-color:#ec4899;border-radius:50%;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body class="text-gray-100">

    <div id="app" class="container mx-auto px-4 py-4 max-w-7xl">
        
        <!-- Header -->
        <header class="relative mb-6 animate-fadeUp">
            <div class="glass rounded-2xl p-5 border border-pink-500/20">
                <div class="flex items-center justify-between flex-wrap gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
                            <i class="fas fa-crown text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-black">
                                <span class="bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">Premium</span>
                                <span class="text-white">Hub</span>
                            </h1>
                            <p class="text-gray-400 text-xs"><i class="fas fa-fire text-pink-500"></i> Exclusive Content</p>
                        </div>
                    </div>
                    <div class="badge-hot px-3 py-1.5 rounded-full text-xs font-bold uppercase">
                        <i class="fas fa-fire mr-1"></i> HOT
                    </div>
                </div>
                
                <!-- Search -->
                <div class="mt-4 max-w-xl">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Search..." 
                               class="w-full pl-11 pr-20 py-3 bg-black/40 border border-pink-500/30 rounded-xl text-white focus:outline-none focus:border-pink-500">
                        <button id="searchBtn" class="absolute right-2 top-1/2 -translate-y-1/2 px-4 py-1.5 gradient-premium rounded-lg text-xs font-semibold">
                            Search
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Slider -->
        <div id="slider" class="relative w-full h-48 md:h-80 mb-6 rounded-2xl overflow-hidden animate-fadeUp" style="animation-delay:0.1s">
            <div id="slider-wrapper" class="slider-wrapper h-full">
                <div class="slider-item skeleton w-full h-full"></div>
            </div>
            <div id="slider-dots" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10"></div>
            <div class="absolute top-4 left-4 z-10">
                <span class="badge-premium px-4 py-1.5 text-xs font-bold text-white"><i class="fas fa-star mr-1"></i> Featured</span>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="animate-fadeUp" style="animation-delay:0.2s">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-1 h-6 bg-gradient-to-b from-pink-500 to-purple-600 rounded-full"></div>
                <h2 class="text-xl font-black text-white"><i class="fas fa-gem text-pink-400 mr-2"></i>Premium Content</h2>
            </div>
            
            <div id="files-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
            </div>
            
            <div id="no-results" class="hidden text-center py-12">
                <div class="inline-flex w-16 h-16 rounded-full glass border border-pink-500/30 mb-4 items-center justify-center">
                    <i class="fas fa-search text-2xl text-gray-500"></i>
                </div>
                <p class="text-lg text-gray-400">No content found</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 glass px-5 py-3 rounded-xl opacity-0 translate-y-4 transition-all duration-300 z-50">
        <div class="flex items-center gap-2">
            <i id="toast-icon" class="fas fa-check-circle text-pink-400"></i>
            <p id="toast-message" class="text-sm"></p>
        </div>
    </div>

    <footer class="mt-10 py-6 border-t border-pink-500/10">
        <div class="text-center">
            <p class="text-gray-500 text-xs">© 2025 PremiumHub • 18+ Only</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State
        let allFiles = [];
        let activeTimer = null;
        let currentFileId = null;
        const WAIT_SECONDS = 10;

        // Toast
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            document.getElementById('toast-icon').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-pink-400';
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2500);
        }

        // Load data
        async function loadData() {
            try {
                const [slidersSnap, filesSnap] = await Promise.all([
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(8))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(40)))
                ]);
                
                renderSliders(slidersSnap);
                renderFiles(filesSnap);
            } catch (e) {
                console.error(e);
            }
        }

        function renderSliders(snapshot) {
            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            wrapper.innerHTML = '';
            dots.innerHTML = '';
            
            const slides = [];
            snapshot.forEach(d => slides.push(d.data()));
            
            if (slides.length) {
                slides.forEach((s, i) => {
                    const el = document.createElement('div');
                    el.className = 'slider-item';
                    el.innerHTML = `<img src="${s.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1200x400/1a1a2e/ec4899'">`;
                    wrapper.appendChild(el);
                    
                    const dot = document.createElement('div');
                    dot.className = 'slider-dot';
                    dot.onclick = () => goToSlide(i);
                    dots.appendChild(dot);
                });
                setupSlider(slides.length);
            }
        }

        let currentSlide = 0;
        let sliderInterval;
        
        function goToSlide(idx) {
            const slides = document.querySelectorAll('.slider-item');
            const dots = document.querySelectorAll('.slider-dot');
            if (!slides.length) return;
            
            currentSlide = (idx + slides.length) % slides.length;
            document.getElementById('slider-wrapper').style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
        }
        
        function setupSlider(count) {
            if (sliderInterval) clearInterval(sliderInterval);
            if (count > 1) {
                sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3500);
            }
            goToSlide(0);
        }

        // Get ad count from localStorage
        function getAdCount(fileId) {
            return parseInt(localStorage.getItem(`ad_${fileId}`) || '0');
        }

        // Set ad count
        function setAdCount(fileId, count) {
            localStorage.setItem(`ad_${fileId}`, count);
            console.log(`📊 Ad count for ${fileId}: ${count}`);
        }

        // Render files
        function renderFiles(snapshot) {
            const grid = document.getElementById('files-grid');
            grid.innerHTML = '';
            allFiles = [];
            
            if (snapshot.empty) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">No content</p>';
                return;
            }
            
            snapshot.forEach(d => allFiles.push({ id: d.id, ...d.data() }));
            
            allFiles.forEach(file => {
                const required = file.requiredAds || 5;
                const watched = getAdCount(file.id);
                const unlocked = watched >= required;
                
                const card = document.createElement('div');
                card.className = 'file-card glass rounded-xl overflow-hidden card-hover border border-pink-500/20';
                card.dataset.fileId = file.id;
                card.dataset.title = file.title.toLowerCase();
                card.dataset.description = file.description.toLowerCase();
                
                card.innerHTML = `
                    <div class="relative aspect-video">
                        <img src="${file.thumbnailUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x225/1a1a2e/ec4899'">
                        <div class="absolute top-2 right-2" id="badge-${file.id}">
                            ${unlocked ? 
                                '<span class="gradient-unlocked px-2 py-1 rounded-lg text-xs font-bold"><i class="fas fa-check mr-1"></i>UNLOCKED</span>' :
                                `<span class="bg-black/70 backdrop-blur-sm px-2 py-1 rounded-lg text-xs border border-pink-500/40"><i class="fas fa-lock mr-1"></i><span id="count-${file.id}">${watched}/${required}</span></span>`
                            }
                        </div>
                        <div class="absolute top-2 left-2">
                            <span class="bg-gradient-to-r from-pink-500/90 to-purple-600/90 px-2 py-1 rounded-lg text-[10px] font-bold"><i class="fas fa-crown mr-1"></i>PREMIUM</span>
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black">
                            <h3 class="font-bold text-sm text-white truncate">${file.title}</h3>
                        </div>
                    </div>
                    <div class="p-3">
                        <p class="text-gray-400 text-xs line-clamp-2 mb-3">${file.description}</p>
                        <div id="btn-${file.id}">
                            ${unlocked ? 
                                `<button onclick="window.open('${file.downloadUrl}', '_blank')" class="w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-unlocked"><i class="fas fa-unlock mr-1"></i>Access Now</button>` :
                                `<button data-file-id="${file.id}" data-required="${required}" class="unlock-btn w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-premium"><span id="btn-text-${file.id}"><i class="fas fa-play-circle mr-1"></i>Unlock (${watched}/${required})</span></button>`
                            }
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Attach event listeners
            document.querySelectorAll('.unlock-btn').forEach(btn => {
                btn.addEventListener('click', handleUnlock);
            });
        }

        // Handle unlock button click
        function handleUnlock(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const btn = e.currentTarget;
            const fileId = btn.dataset.fileId;
            const required = parseInt(btn.dataset.required) || 5;
            
            // Check if already counting
            if (activeTimer) {
                showToast('Please wait for current timer to finish', true);
                return;
            }
            
            // Disable button and show counting
            btn.disabled = true;
            currentFileId = fileId;
            
            const btnText = document.getElementById(`btn-text-${fileId}`);
            const originalText = btnText.innerHTML;
            
            let secondsLeft = WAIT_SECONDS;
            btnText.innerHTML = `<span class="progress-ring inline-block mr-2"></span>Wait ${secondsLeft}s`;
            
            activeTimer = setInterval(() => {
                secondsLeft--;
                btnText.innerHTML = `<span class="progress-ring inline-block mr-2"></span>Wait ${secondsLeft}s`;
                
                if (secondsLeft <= 0) {
                    clearInterval(activeTimer);
                    activeTimer = null;
                    
                    // Increment counter
                    const currentCount = getAdCount(fileId);
                    const newCount = currentCount + 1;
                    setAdCount(fileId, newCount);
                    
                    console.log(`✅ Ad counted! ${fileId}: ${newCount}/${required}`);
                    
                    if (newCount >= required) {
                        // UNLOCKED!
                        showToast('🎉 Content Unlocked!');
                        
                        // Update badge
                        const badge = document.getElementById(`badge-${fileId}`);
                        badge.innerHTML = '<span class="gradient-unlocked px-2 py-1 rounded-lg text-xs font-bold"><i class="fas fa-check mr-1"></i>UNLOCKED</span>';
                        
                        // Update button
                        const file = allFiles.find(f => f.id === fileId);
                        const btnContainer = document.getElementById(`btn-${fileId}`);
                        btnContainer.innerHTML = `<button onclick="window.open('${file.downloadUrl}', '_blank')" class="w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-unlocked"><i class="fas fa-unlock mr-1"></i>Access Now</button>`;
                    } else {
                        // Not yet unlocked
                        showToast(`📺 Progress: ${newCount}/${required}`);
                        
                        // Update badge count
                        const countSpan = document.getElementById(`count-${fileId}`);
                        if (countSpan) countSpan.textContent = `${newCount}/${required}`;
                        
                        // Reset button
                        btn.disabled = false;
                        btnText.innerHTML = `<i class="fas fa-play-circle mr-1"></i>Unlock (${newCount}/${required})`;
                    }
                    
                    currentFileId = null;
                }
            }, 1000);
        }

        // Search
        function handleSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            let visible = 0;
            
            document.querySelectorAll('.file-card').forEach(card => {
                const title = card.dataset.title || '';
                const desc = card.dataset.description || '';
                const show = title.includes(term) || desc.includes(term);
                card.style.display = show ? 'block' : 'none';
                if (show) visible++;
            });
            
            document.getElementById('no-results').classList.toggle('hidden', visible > 0);
        }

        // Reset function (for testing)
        window.resetAll = function() {
            allFiles.forEach(f => {
                localStorage.removeItem(`ad_${f.id}`);
            });
            console.log('✅ All ad counts reset');
            location.reload();
        };

        window.showCounts = function() {
            console.log('📊 Current ad counts:');
            allFiles.forEach(f => {
                console.log(`  ${f.id}: ${getAdCount(f.id)}/${f.requiredAds || 5}`);
            });
        };

        // Initialize
        loadData();
        
        document.getElementById('searchInput').addEventListener('input', handleSearch);
        document.getElementById('searchBtn').addEventListener('click', handleSearch);
    </script>
</body>
</html>
