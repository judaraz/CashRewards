<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Downloader</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Adsgram SDK -->
    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        /* Custom styles for animations and aesthetics */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .animation-delay-200 { animation-delay: 0.2s; }
        .animation-delay-400 { animation-delay: 0.4s; }
        .slider-container { position: relative; overflow: hidden; }
        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; }
        .slider-item { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .slider-dot { width: 10px; height: 10px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: background-color 0.3s; }
        .slider-dot.active { background-color: white; }
        body { scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        
        /* Loading spinner */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Banner ad container */
        .banner-ad {
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="app" class="container mx-auto p-4 max-w-7xl">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-xl shadow-lg mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-center mb-4">Webapp Sikho</h1>
            <p class="text-center text-lg text-blue-100 mb-6">Watch Ads, Unlock, and Download Files for Free!</p>
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search for files..." class="w-full p-3 pl-10 rounded-full bg-white text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-shadow duration-300">
                </div>
            </div>
        </header>

        <!-- Banner Ad Slot 1 -->
        <div id="ad-container-1" class="banner-ad my-6"></div>

        <!-- Image Slider -->
        <div id="slider" class="slider-container w-full h-48 md:h-80 bg-gray-300 rounded-xl shadow-lg mb-10 slide-up animation-delay-200">
            <div id="slider-wrapper" class="slider-wrapper h-full"></div>
            <div id="slider-dots" class="slider-dots"></div>
        </div>

        <!-- Banner Ad Slot 2 -->
        <div id="ad-container-2" class="banner-ad my-6"></div>

        <!-- Files Section -->
        <div class="slide-up animation-delay-400">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-4 border-blue-500 pb-2">Available Files</h2>
            <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- File cards will be injected here -->
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <i class="fas fa-file-excel text-5xl text-gray-400 mb-4"></i>
                <p class="text-xl text-gray-600">No files found matching your search.</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white py-3 px-5 rounded-lg shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-50">
        <p id="toast-message"></p>
    </div>

    <!-- Footer with Banner Ad Slot 3 -->
    <footer class="bg-gray-100 py-6 mt-10">
        <div class="container mx-auto px-4">
            <div id="ad-container-3" class="banner-ad my-4"></div>
            <p class="text-center text-gray-600">&copy; 2025 Webapp Sikho. All rights reserved.</p>
        </div>
    </footer>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCPJR-Zkkkh4Y-aQQ8H1J7N2Edo0HWM14k",
            authDomain: "download-cce9e.firebaseapp.com",
            projectId: "download-cce9e",
            storageBucket: "download-cce9e.firebasestorage.app",
            messagingSenderId: "510020310830",
            appId: "1:510020310830:web:eb41a23de415924c2f8cbf",
            measurementId: "G-TYT03595HP"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('no-results');

        let sliderInterval;
        let currentSlide = 0;
        let timerDuration = 10; // Default wait time in seconds
        
        // Adsgram controller
        let AdController = null;
        let adsgramReady = false;
        let isAdInProgress = false;

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 3000);
        }

        // Initialize Adsgram with int-21144
        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                try {
                    AdController = window.Adsgram.init({ blockId: "int-21144" });
                    console.log(`✅ Adsgram initialized with blockId: int-21144`);
                    adsgramReady = true;
                } catch (e) {
                    console.log("❌ Adsgram init failed:", e);
                    adsgramReady = false;
                }
            } else {
                console.log("⏳ Adsgram SDK not loaded, retrying...");
                setTimeout(initAdsgram, 500);
            }
        }

        // Show interstitial ad
        async function showInterstitialAd() {
            return new Promise((resolve) => {
                if (!adsgramReady || !AdController) {
                    console.log("⚠️ Adsgram not ready");
                    resolve(false);
                    return;
                }
                
                const adTimeout = setTimeout(() => {
                    console.log("⏱️ Ad timeout");
                    resolve(false);
                }, 5000);
                
                try {
                    AdController.show()
                        .then(() => {
                            clearTimeout(adTimeout);
                            console.log("✅ Ad shown successfully");
                            resolve(true);
                        })
                        .catch((error) => {
                            clearTimeout(adTimeout);
                            console.log("❌ Ad failed:", error?.message || error);
                            resolve(false);
                        });
                } catch (e) {
                    clearTimeout(adTimeout);
                    console.log("❌ Ad exception:", e);
                    resolve(false);
                }
            });
        }

        // Render banner ad from admin panel
        function renderBannerAd(containerId, adCode) {
            if (!adCode) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = adCode;
            
            // Execute any scripts in the ad code
            const scripts = Array.from(container.getElementsByTagName('script'));
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // Load banner ads from admin panel
        async function loadBannerAds() {
            try {
                const docRef = doc(db, "settings", "ads");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const adData = docSnap.data();
                    renderBannerAd('ad-container-1', adData.adSlot1);
                    renderBannerAd('ad-container-2', adData.adSlot2);
                    renderBannerAd('ad-container-3', adData.adSlot3);
                    console.log("✅ Banner ads loaded");
                }
            } catch (error) {
                console.error("Error loading banner ads:", error);
            }
        }

        async function loadUserPageData() {
            // Load banner ads
            await loadBannerAds();
            
            // Load timer settings
            try {
                const settingsRef = doc(db, "settings", "general");
                const docSnap = await getDoc(settingsRef);
                if (docSnap.exists()) {
                    timerDuration = docSnap.data().timerDuration || 10;
                }
            } catch (error) {
                console.error("Could not fetch settings, using defaults.", error);
            }

            // Load sliders
            try {
                const q = query(collection(db, "sliders"), orderBy("createdAt", "desc"));
                const sliderSnapshot = await getDocs(q);
                sliderWrapper.innerHTML = '';
                sliderDotsContainer.innerHTML = '';
                const slides = [];
                sliderSnapshot.forEach(doc => slides.push(doc.data()));
                if (slides.length > 0) {
                    slides.forEach((slide, index) => {
                        const slideEl = document.createElement('div');
                        slideEl.className = 'slider-item';
                        const imageHTML = `<img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/1280x400/cccccc/ffffff?text=Image+Not+Found';">`;
                        slideEl.innerHTML = slide.linkUrl ? `<a href="${slide.linkUrl}" target="_blank" rel="noopener noreferrer">${imageHTML}</a>` : imageHTML;
                        sliderWrapper.appendChild(slideEl);
                        const dotEl = document.createElement('div');
                        dotEl.className = 'slider-dot';
                        dotEl.dataset.index = index;
                        sliderDotsContainer.appendChild(dotEl);
                    });
                    setupSlider(slides.length);
                } else {
                    sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-gray-200 rounded-xl"><p class="text-gray-600">No promotional slides available.</p></div>`;
                }
            } catch (error) {
                console.error("Error loading sliders:", error);
                sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-red-100 rounded-xl"><p class="text-red-600">Could not load slides.</p></div>`;
            }
            
            // Load files
            try {
                const q = query(collection(db, "files"), orderBy("createdAt", "desc"));
                const filesSnapshot = await getDocs(q);
                filesGrid.innerHTML = '';
                if (filesSnapshot.empty) {
                    filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No files have been uploaded yet.</p>`;
                    return;
                }
                const files = [];
                filesSnapshot.forEach(doc => files.push({ id: doc.id, ...doc.data() }));
                files.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'file-card bg-white rounded-xl shadow-md overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 hover:shadow-xl';
                    card.dataset.title = file.title.toLowerCase();
                    card.dataset.description = (file.description || '').toLowerCase();
                    card.innerHTML = `
                        <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full aspect-video object-cover" onerror="this.onerror=null;this.src='https://placehold.co/400x225/cccccc/ffffff?text=Image+Not+Found';">
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-gray-900 truncate" title="${file.title}">${file.title}</h3>
                            <p class="text-gray-600 text-sm mt-1 h-10 overflow-hidden">${file.description || ''}</p>
                            <button data-id="${file.id}" data-url="${file.downloadUrl}" data-required-ads="${file.requiredAds || 10}" class="download-btn w-full mt-4 py-2.5 px-4 rounded-lg text-white font-semibold transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                                <i class="fas"></i>
                                <span></span>
                            </button>
                        </div>
                    `;
                    filesGrid.appendChild(card);
                    updateButtonState(card.querySelector('.download-btn'));
                });
            } catch (error) {
                console.error("Error loading files:", error);
                filesGrid.innerHTML = `<p class="col-span-full text-center text-red-500">Could not load files. Please try again later.</p>`;
            }
        }

        function setupSlider(slideCount) {
            if (slideCount <= 1) {
                if(slideCount === 1 && document.querySelector('.slider-dot')) {
                    document.querySelector('.slider-dot').classList.add('active');
                }
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            function goToSlide(slideIndex) {
                currentSlide = (slideIndex + slideCount) % slideCount;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3000);
            dots.forEach(dot => dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index))));
            goToSlide(0);
        }

        function updateButtonState(button) {
            const fileId = button.dataset.id;
            const requiredCount = parseInt(button.dataset.requiredAds);
            const adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            const isUnlocked = adCount >= requiredCount;
            const buttonTextEl = button.querySelector('span');
            const buttonIconEl = button.querySelector('i');
            button.disabled = false;
            const lockedColors = ['bg-gradient-to-r', 'from-blue-500', 'to-purple-600', 'hover:from-blue-600', 'hover:to-purple-700'];
            const unlockedColors = ['bg-gradient-to-r', 'from-green-400', 'to-green-600', 'hover:from-green-500', 'hover:to-green-700'];
            button.classList.remove(...lockedColors, ...unlockedColors);
            if (isUnlocked) {
                buttonTextEl.textContent = 'Download Now';
                buttonIconEl.className = 'fas fa-download';
                button.classList.add(...unlockedColors);
            } else {
                buttonTextEl.textContent = `Unlock (${adCount}/${requiredCount})`;
                buttonIconEl.className = 'fas fa-lock';
                button.classList.add(...lockedColors);
            }
        }

        function handleDownloadClick(e) {
            const button = e.target.closest('.download-btn');
            if (!button || button.disabled || isAdInProgress) return;
            const fileId = button.dataset.id;
            const downloadUrl = button.dataset.url;
            const requiredCount = parseInt(button.dataset.requiredAds);
            const adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            if (adCount >= requiredCount) {
                showToast('Your download is starting...');
                window.open(downloadUrl, '_blank');
                return;
            }
            processAdUnlock(button);
        }

        async function processAdUnlock(button) {
            if (isAdInProgress) return;
            
            button.disabled = true;
            isAdInProgress = true;
            const buttonTextEl = button.querySelector('span');
            const fileId = button.dataset.id;
            const requiredCount = parseInt(button.dataset.requiredAds);
            let adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            
            try {
                buttonTextEl.textContent = 'Loading ad...';
                
                // Show Adsgram interstitial
                const adShown = await showInterstitialAd();
                
                if (!adShown) {
                    console.log("Ad not shown, but still counting progress");
                }
                
                adCount++;
                localStorage.setItem(`adCount_${fileId}`, adCount);
                
                if (adCount >= requiredCount) {
                    showToast('Download unlocked!');
                    updateButtonState(button);
                    isAdInProgress = false;
                    return;
                }
                
                showToast(`Progress: ${adCount}/${requiredCount}`);
                
                let countdown = timerDuration;
                buttonTextEl.textContent = `Please wait ${countdown}s`;
                
                const timerInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        buttonTextEl.textContent = `Please wait ${countdown}s`;
                    } else {
                        clearInterval(timerInterval);
                        updateButtonState(button);
                        isAdInProgress = false;
                    }
                }, 1000);
                
            } catch (err) {
                console.error("Ad error:", err);
                showToast('Could not load ad. Please try again.');
                updateButtonState(button);
                isAdInProgress = false;
            }
        }

        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const fileCards = document.querySelectorAll('.file-card');
            let visibleCount = 0;
            fileCards.forEach(card => {
                const title = card.dataset.title || '';
                const description = card.dataset.description || '';
                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            noResultsMessage.classList.toggle('hidden', visibleCount > 0);
        }

        window.addEventListener('load', () => {
            loadUserPageData();
            
            // Initialize Adsgram with int-21144
            initAdsgram();
            setTimeout(initAdsgram, 1000);
            setTimeout(initAdsgram, 2000);
        });

        filesGrid.addEventListener('click', handleDownloadClick);
        searchInput.addEventListener('input', handleSearch);
        
        // Debug functions
        window.checkAds = () => {
            console.log("Adsgram ready:", adsgramReady);
            console.log("AdController:", AdController);
        };
        
        window.resetAdCounts = () => {
            localStorage.clear();
            console.log("✅ All ad counts reset");
            location.reload();
        };
    </script>
</body>
</html>
