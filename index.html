<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Downloader</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Adsgram SDK - Load after page renders -->
    <style>
        /* Custom styles for animations and aesthetics */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .animation-delay-200 { animation-delay: 0.2s; }
        .animation-delay-400 { animation-delay: 0.4s; }
        .slider-container { position: relative; overflow: hidden; }
        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; }
        .slider-item { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .slider-dot { width: 10px; height: 10px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: background-color 0.3s; }
        .slider-dot.active { background-color: white; }
        body { scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        
        /* Skeleton loading animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="app" class="container mx-auto p-4 max-w-7xl">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-xl shadow-lg mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-center mb-4">Webapp Sikho</h1>
            <p class="text-center text-lg text-blue-100 mb-6">Watch Ads, Unlock, and Download Files for Free!</p>
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search for files..." class="w-full p-3 pl-10 rounded-full bg-white text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-shadow duration-300">
                </div>
            </div>
        </header>

        <!-- Image Slider -->
        <div id="slider" class="slider-container w-full h-48 md:h-80 bg-gray-300 rounded-xl shadow-lg mb-10 slide-up animation-delay-200">
            <div id="slider-wrapper" class="slider-wrapper h-full">
                <!-- Skeleton loader -->
                <div class="slider-item skeleton w-full h-full"></div>
            </div>
            <div id="slider-dots" class="slider-dots"></div>
        </div>

        <!-- Files Section -->
        <div class="slide-up animation-delay-400">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-4 border-blue-500 pb-2">Available Files</h2>
            <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Skeleton loaders -->
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <i class="fas fa-file-excel text-5xl text-gray-400 mb-4"></i>
                <p class="text-xl text-gray-600">No files found matching your search.</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white py-3 px-5 rounded-lg shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-50">
        <p id="toast-message"></p>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-100 py-6 mt-10">
        <div class="container mx-auto px-4">
            <p class="text-center text-gray-600">&copy; 2025 Webapp Sikho. All rights reserved.</p>
        </div>
    </footer>

    <!-- Load Adsgram SDK asynchronously -->
    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            databaseURL: "https://visit-1f400-default-rtdb.firebaseio.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        // Initialize Firebase first
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('no-results');

        let sliderInterval;
        let currentSlide = 0;
        let timerDuration = 10;
        let AdController = null;
        let allFiles = [];

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 3000);
        }

        // Initialize Adsgram when ready
        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                AdController = window.Adsgram.init({ blockId: "21145" });
                console.log("Adsgram initialized");
            } else {
                setTimeout(initAdsgram, 500);
            }
        }

        // Load all data in parallel
        async function loadAllData() {
            try {
                // Load settings and data in parallel
                const [settingsSnap, slidersSnap, filesSnap] = await Promise.all([
                    getDoc(doc(db, "settings", "general")),
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(10))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(50)))
                ]);
                
                // Process settings
                if (settingsSnap.exists()) {
                    timerDuration = settingsSnap.data().timerDuration || 10;
                }
                
                // Process sliders
                renderSliders(slidersSnap);
                
                // Process files
                renderFiles(filesSnap);
                
            } catch (error) {
                console.error("Error loading data:", error);
                showErrorStates();
            }
        }

        function renderSliders(sliderSnapshot) {
            sliderWrapper.innerHTML = '';
            sliderDotsContainer.innerHTML = '';
            const slides = [];
            sliderSnapshot.forEach(doc => slides.push(doc.data()));
            
            if (slides.length > 0) {
                slides.forEach((slide, index) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = 'slider-item';
                    const imageHTML = `<img src="${slide.imageUrl}" class="w-full h-full object-cover" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/1280x400/cccccc/ffffff?text=Image+Not+Found';">`;
                    slideEl.innerHTML = slide.linkUrl ? `<a href="${slide.linkUrl}" target="_blank" rel="noopener noreferrer">${imageHTML}</a>` : imageHTML;
                    sliderWrapper.appendChild(slideEl);
                    
                    const dotEl = document.createElement('div');
                    dotEl.className = 'slider-dot';
                    dotEl.dataset.index = index;
                    sliderDotsContainer.appendChild(dotEl);
                });
                setupSlider(slides.length);
            } else {
                sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-gray-200 rounded-xl"><p class="text-gray-600">No promotional slides available.</p></div>`;
            }
        }

        function renderFiles(filesSnapshot) {
            filesGrid.innerHTML = '';
            allFiles = [];
            
            if (filesSnapshot.empty) {
                filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No files have been uploaded yet.</p>`;
                return;
            }
            
            filesSnapshot.forEach(doc => allFiles.push({ id: doc.id, ...doc.data() }));
            
            // Use DocumentFragment for better performance
            const fragment = document.createDocumentFragment();
            
            allFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card bg-white rounded-xl shadow-md overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 hover:shadow-xl';
                card.dataset.title = file.title.toLowerCase();
                card.dataset.description = file.description.toLowerCase();
                
                const requiredAds = file.requiredAds || 5; // Default to 5 if not set
                const adCount = parseInt(localStorage.getItem(`adCount_${file.id}`) || 0);
                const isUnlocked = adCount >= requiredAds;
                
                card.innerHTML = `
                    <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full aspect-video object-cover" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x225/cccccc/ffffff?text=Image+Not+Found';">
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-gray-900 truncate" title="${file.title}">${file.title}</h3>
                        <p class="text-gray-600 text-sm mt-1 h-10 overflow-hidden">${file.description}</p>
                        <div class="mt-3 space-y-2">
                            ${!isUnlocked ? `
                                <button data-id="${file.id}" data-required-ads="${requiredAds}" class="watch-ad-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700">
                                    <i class="fas fa-play-circle"></i>
                                    <span>Watch Ad (${adCount}/${requiredAds})</span>
                                </button>
                            ` : ''}
                            ${isUnlocked ? `
                                <button data-url="${file.downloadUrl}" class="open-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700">
                                    <i class="fas fa-external-link-alt"></i>
                                    <span>Open File</span>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            
            filesGrid.appendChild(fragment);
        }

        function showErrorStates() {
            sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-red-100 rounded-xl"><p class="text-red-600">Could not load slides.</p></div>`;
            filesGrid.innerHTML = `<p class="col-span-full text-center text-red-500">Could not load files. Please try again later.</p>`;
        }

        function setupSlider(slideCount) {
            if (slideCount <= 1) {
                if(slideCount === 1) document.querySelector('.slider-dot').classList.add('active');
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            function goToSlide(slideIndex) {
                currentSlide = (slideIndex + slideCount) % slideCount;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3000);
            dots.forEach(dot => dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index))));
            goToSlide(0);
        }

        function updateFileCardButtons(fileId) {
            const fileCard = document.querySelector(`[data-id="${fileId}"]`).closest('.file-card');
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;
            
            const requiredAds = file.requiredAds || 5;
            const adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            const isUnlocked = adCount >= requiredAds;
            
            const buttonContainer = fileCard.querySelector('.mt-3');
            buttonContainer.innerHTML = `
                ${!isUnlocked ? `
                    <button data-id="${fileId}" data-required-ads="${requiredAds}" class="watch-ad-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700">
                        <i class="fas fa-play-circle"></i>
                        <span>Watch Ad (${adCount}/${requiredAds})</span>
                    </button>
                ` : ''}
                ${isUnlocked ? `
                    <button data-url="${file.downloadUrl}" class="open-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700">
                        <i class="fas fa-external-link-alt"></i>
                        <span>Open File</span>
                    </button>
                ` : ''}
            `;
        }

        async function handleWatchAdClick(button) {
            if (button.disabled) return;
            
            button.disabled = true;
            const fileId = button.dataset.id;
            const requiredAds = parseInt(button.dataset.requiredAds) || 5;
            let adCount = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
            const buttonSpan = button.querySelector('span');
            const originalText = buttonSpan.textContent;
            
            try {
                buttonSpan.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Loading ad...';
                
                // Show ad using Adsgram
                if (AdController) {
                    await AdController.show();
                    adCount++;
                    localStorage.setItem(`adCount_${fileId}`, adCount);
                } else {
                    // For testing/demo purposes
                    console.log("Ad shown (demo mode)");
                    adCount++;
                    localStorage.setItem(`adCount_${fileId}`, adCount);
                }
                
                if (adCount >= requiredAds) {
                    showToast('🎉 File unlocked! You can now open it.');
                    updateFileCardButtons(fileId);
                    return;
                }
                
                showToast(`📺 Progress: ${adCount}/${requiredAds} ads watched`);
                
                // Start countdown timer
                let countdown = timerDuration;
                buttonSpan.textContent = `Wait ${countdown}s`;
                
                const timerInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        buttonSpan.textContent = `Wait ${countdown}s`;
                    } else {
                        clearInterval(timerInterval);
                        button.disabled = false;
                        buttonSpan.textContent = `Watch Ad (${adCount}/${requiredAds})`;
                    }
                }, 1000);
                
            } catch (err) {
                console.error("Ad error:", err);
                showToast('Could not load ad. Please try again.');
                button.disabled = false;
                buttonSpan.textContent = originalText;
            }
        }

        function handleOpenClick(button) {
            const downloadUrl = button.dataset.url;
            if (downloadUrl) {
                showToast('📥 Opening file...');
                window.open(downloadUrl, '_blank');
            }
        }

        function handleButtonClick(e) {
            const watchAdBtn = e.target.closest('.watch-ad-btn');
            const openBtn = e.target.closest('.open-btn');
            
            if (watchAdBtn) {
                handleWatchAdClick(watchAdBtn);
            } else if (openBtn) {
                handleOpenClick(openBtn);
            }
        }

        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const fileCards = document.querySelectorAll('.file-card');
            let visibleCount = 0;
            
            fileCards.forEach(card => {
                const title = card.dataset.title;
                const description = card.dataset.description;
                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            noResultsMessage.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // Start everything immediately
        loadAllData();
        initAdsgram();

        // Event listeners
        filesGrid.addEventListener('click', handleButtonClick);
        searchInput.addEventListener('input', handleSearch);
    </script>
</body>
</html>
