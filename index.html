<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Webapp Sikho • File Downloader</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            scrollbar-width: none;
            background: #f9fafb;
        }
        
        body::-webkit-scrollbar {
            display: none;
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .animation-delay-200 { animation-delay: 0.2s; }
        .animation-delay-400 { animation-delay: 0.4s; }
        
        .slider-container { 
            position: relative; 
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .slider-wrapper { 
            display: flex; 
            transition: transform 0.5s ease-in-out; 
        }
        
        .slider-item { 
            min-width: 100%; 
            box-sizing: border-box; 
        }
        
        .slider-dots { 
            position: absolute; 
            bottom: 12px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 8px;
            z-index: 10;
        }
        
        .slider-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        
        .slider-dot.active { 
            width: 24px;
            border-radius: 4px;
            background: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .access-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .access-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .timer-badge {
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            margin-left: 0.5rem;
            font-weight: 500;
        }
        
        .banner-ad {
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        /* Popup styles */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .popup-card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .popup-overlay.active .popup-card {
            transform: scale(1);
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .popup-title {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .popup-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
        }
        
        .popup-close:hover {
            background: #e5e7eb;
            color: #374151;
        }
        
        .link-preview-box {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
            border: 1px dashed #d1d5db;
            margin-bottom: 24px;
            word-break: break-all;
        }
        
        .link-text {
            font-size: 0.9rem;
            color: #374151;
            font-family: monospace;
        }
        
        .popup-actions {
            display: flex;
            gap: 12px;
        }
        
        .popup-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        
        .btn-copy {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-copy:hover {
            background: #e5e7eb;
        }
        
        .btn-open {
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            color: white;
        }
        
        .btn-open:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="app" class="container mx-auto p-4 max-w-7xl">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-xl shadow-lg mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-center mb-4">Webapp Sikho</h1>
            <p class="text-center text-lg text-blue-100 mb-6">Watch Ads, Unlock, and Download Files for Free!</p>
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search for files..." class="w-full p-3 pl-10 rounded-full bg-white text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-shadow duration-300">
                </div>
            </div>
        </header>

        <!-- Banner Ad Slot 1 -->
        <div id="ad-container-1" class="banner-ad my-6"></div>

        <!-- Image Slider -->
        <div class="slide-up animation-delay-200">
            <div id="slider" class="slider-container w-full h-48 md:h-80 bg-gray-200 mb-10">
                <div id="slider-wrapper" class="slider-wrapper h-full"></div>
                <div id="slider-dots" class="slider-dots"></div>
            </div>
        </div>

        <!-- Banner Ad Slot 2 -->
        <div id="ad-container-2" class="banner-ad my-6"></div>

        <!-- Files Section -->
        <div class="slide-up animation-delay-400">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-4 border-blue-500 pb-2">Available Files</h2>
            <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- File cards will be injected here -->
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <i class="fas fa-file-excel text-5xl text-gray-400 mb-4"></i>
                <p class="text-xl text-gray-600">No files found matching your search.</p>
            </div>
        </div>
    </div>

    <!-- Link Popup -->
    <div id="linkPopup" class="popup-overlay">
        <div class="popup-card">
            <div class="popup-header">
                <span class="popup-title"><i class="fas fa-link mr-2"></i>Link Ready</span>
                <div class="popup-close" id="closePopupBtn">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="link-preview-box">
                <div class="link-text" id="popupLinkDisplay">https://</div>
            </div>
            <div class="popup-actions">
                <button class="popup-btn btn-copy" id="copyLinkBtn">
                    <i class="far fa-copy"></i> Copy
                </button>
                <button class="popup-btn btn-open" id="openLinkBtn">
                    <i class="fas fa-external-link-alt"></i> Open
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white py-3 px-5 rounded-lg shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-50">
        <p id="toast-message"></p>
    </div>

    <!-- Footer with Banner Ad Slot 3 -->
    <footer class="bg-gray-100 py-6 mt-10">
        <div class="container mx-auto px-4">
            <div id="ad-container-3" class="banner-ad my-4"></div>
            <p class="text-center text-gray-600">&copy; 2025 Webapp Sikho. All rights reserved.</p>
        </div>
    </footer>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // Main application code
        (function() {
            // Initialize Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyCPJR-Zkkkh4Y-aQQ8H1J7N2Edo0HWM14k",
                authDomain: "download-cce9e.firebaseapp.com",
                projectId: "download-cce9e",
                storageBucket: "download-cce9e.firebasestorage.app",
                messagingSenderId: "510020310830",
                appId: "1:510020310830:web:eb41a23de415924c2f8cbf",
                measurementId: "G-TYT03595HP"
            };
            
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            const sliderWrapper = document.getElementById('slider-wrapper');
            const sliderDotsContainer = document.getElementById('slider-dots');
            const filesGrid = document.getElementById('files-grid');
            const searchInput = document.getElementById('searchInput');
            const noResultsMessage = document.getElementById('no-results');

            // Popup elements
            const popupOverlay = document.getElementById('linkPopup');
            const popupLinkDisplay = document.getElementById('popupLinkDisplay');
            const closePopupBtn = document.getElementById('closePopupBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const openLinkBtn = document.getElementById('openLinkBtn');

            let currentPopupLink = '';
            let currentFileId = '';
            let sliderInterval;
            let currentSlide = 0;
            let timerDuration = 10;
            let unlockDuration = 10;
            
            // Adsgram controller
            let AdController = null;
            let adsgramReady = false;
            let isAdInProgress = false;
            
            const unlockTimers = new Map();
            const viewedFiles = new Set();
            const fileCooldowns = new Map();

            function showToast(message) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').textContent = message;
                toast.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 2000);
            }

            // Track file view in Firebase
            async function trackFileView(fileId) {
                if (!fileId || viewedFiles.has(fileId)) return;
                
                try {
                    const fileRef = db.collection("files").doc(fileId);
                    await fileRef.update({
                        views: firebase.firestore.FieldValue.increment(1)
                    });
                    viewedFiles.add(fileId);
                    console.log(`✅ File view tracked: ${fileId}`);
                } catch (error) {
                    console.error('Error tracking file view:', error);
                }
            }

            // Popup functions
            function showLinkPopup(link, fileId) {
                if (!link) return;
                currentPopupLink = link;
                currentFileId = fileId;
                popupLinkDisplay.textContent = link;
                popupOverlay.classList.add('active');
                
                if (fileId) {
                    trackFileView(fileId);
                }
            }

            function hidePopup() {
                popupOverlay.classList.remove('active');
                currentFileId = '';
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('🔗 Link copied to clipboard');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }
            
            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('🔗 Link copied to clipboard');
                } catch (err) {
                    showToast('❌ Failed to copy');
                }
                document.body.removeChild(textarea);
            }

            function openLinkInBrowser(link) {
                if (!link) return;
                
                if (!link.startsWith('http://') && !link.startsWith('https://')) {
                    link = 'https://' + link;
                }
                
                window.open(link, '_blank');
            }

            // Popup event listeners
            closePopupBtn.addEventListener('click', hidePopup);
            popupOverlay.addEventListener('click', (e) => {
                if (e.target === popupOverlay) hidePopup();
            });
            
            copyLinkBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPopupLink) {
                    copyToClipboard(currentPopupLink);
                    hidePopup();
                }
            });
            
            openLinkBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPopupLink) {
                    openLinkInBrowser(currentPopupLink);
                    hidePopup();
                }
            });

            // Initialize Adsgram with int-21144
            function initAdsGram() {
                if (typeof window.Adsgram !== 'undefined') {
                    try {
                        AdController = window.Adsgram.init({ blockId: "int-21144" });
                        console.log("✅ AdsGram initialized with blockId: int-21144");
                        adsgramReady = true;
                    } catch (e) {
                        console.log("❌ AdsGram init failed:", e);
                        adsgramReady = false;
                    }
                } else {
                    console.log("⏳ AdsGram SDK not loaded, retrying...");
                    setTimeout(initAdsGram, 500);
                }
            }

            // Check if unlock is still valid
            function checkUnlockExpiry(fileId) {
                const unlockData = JSON.parse(localStorage.getItem('unlock_' + fileId) || '{}');
                if (unlockData.expiryTime && Date.now() > unlockData.expiryTime) {
                    localStorage.removeItem('adCount_' + fileId);
                    localStorage.removeItem('unlock_' + fileId);
                    return false;
                }
                return unlockData.expiryTime && Date.now() <= unlockData.expiryTime;
            }

            // Start unlock timer display
            function startUnlockTimer(fileId, button) {
                if (unlockTimers.has(fileId)) {
                    clearInterval(unlockTimers.get(fileId));
                    unlockTimers.delete(fileId);
                }
                
                const timer = setInterval(() => {
                    const unlockData = JSON.parse(localStorage.getItem('unlock_' + fileId) || '{}');
                    if (!unlockData.expiryTime || Date.now() > unlockData.expiryTime) {
                        clearInterval(timer);
                        unlockTimers.delete(fileId);
                        localStorage.removeItem('adCount_' + fileId);
                        localStorage.removeItem('unlock_' + fileId);
                        updateButtonState(button);
                        showToast('⏰ Unlock period expired');
                        return;
                    }

                    const timeLeft = unlockData.expiryTime - Date.now();
                    const minutes = Math.floor(timeLeft / 60000);
                    const seconds = Math.floor((timeLeft % 60000) / 1000);
                    
                    const existingBadge = button.querySelector('.timer-badge');
                    if (existingBadge) {
                        existingBadge.textContent = `${minutes}m ${seconds}s`;
                    }
                }, 1000);

                unlockTimers.set(fileId, timer);
            }

            // Update button appearance based on unlock state
            function updateButtonState(button) {
                const fileId = button.dataset.fileId;
                const requiredCount = parseInt(button.dataset.requiredAds || 1);
                const isUnlocked = checkUnlockExpiry(fileId);
                const adCount = parseInt(localStorage.getItem('adCount_' + fileId) || 0);
                
                button.disabled = false;
                const buttonTextEl = button.querySelector('span');
                const buttonIconEl = button.querySelector('i');
                
                let existingBadge = button.querySelector('.timer-badge');
                
                const lockedClasses = ['bg-gradient-to-r', 'from-blue-500', 'to-purple-600', 'hover:from-blue-600', 'hover:to-purple-700'];
                const unlockedClasses = ['bg-gradient-to-r', 'from-green-400', 'to-green-600', 'hover:from-green-500', 'hover:to-green-700'];
                
                // Remove all gradient classes
                button.classList.remove('bg-gradient-to-r', 'from-blue-500', 'to-purple-600', 'hover:from-blue-600', 'hover:to-purple-700',
                                            'from-green-400', 'to-green-600', 'hover:from-green-500', 'hover:to-green-700');
                
                if (isUnlocked) {
                    buttonTextEl.textContent = 'Download Now';
                    buttonIconEl.className = 'fas fa-download';
                    button.classList.add('bg-gradient-to-r', 'from-green-400', 'to-green-600', 'hover:from-green-500', 'hover:to-green-700');
                    
                    if (!existingBadge) {
                        existingBadge = document.createElement('span');
                        existingBadge.className = 'timer-badge';
                        button.appendChild(existingBadge);
                    }
                    existingBadge.style.display = 'inline-block';
                    
                    startUnlockTimer(fileId, button);
                } else {
                    buttonTextEl.textContent = `Unlock (${adCount}/${requiredCount})`;
                    buttonIconEl.className = 'fas fa-lock';
                    button.classList.add('bg-gradient-to-r', 'from-blue-500', 'to-purple-600', 'hover:from-blue-600', 'hover:to-purple-700');
                    
                    if (existingBadge) {
                        existingBadge.style.display = 'none';
                    }
                    
                    if (unlockTimers.has(fileId)) {
                        clearInterval(unlockTimers.get(fileId));
                        unlockTimers.delete(fileId);
                    }
                }
            }

            // Show interstitial ad
            function showInterstitialAd() {
                return new Promise((resolve) => {
                    if (!adsgramReady || !AdController) {
                        console.log("⚠️ AdsGram not ready");
                        resolve({ done: false });
                        return;
                    }
                    
                    const adTimeout = setTimeout(() => {
                        console.log("⏱️ Ad timeout");
                        resolve({ done: false });
                    }, 5000);
                    
                    try {
                        AdController.show()
                            .then((result) => {
                                clearTimeout(adTimeout);
                                console.log("✅ Ad shown successfully");
                                resolve({ done: true, ...result });
                            })
                            .catch((error) => {
                                clearTimeout(adTimeout);
                                console.log("❌ Ad failed:", error?.message || error);
                                resolve({ done: false });
                            });
                    } catch (e) {
                        clearTimeout(adTimeout);
                        console.log("❌ Ad exception:", e);
                        resolve({ done: false });
                    }
                });
            }

            // Start cooldown timer between ads
            function startCooldownTimer(button) {
                const buttonTextEl = button.querySelector('span');
                const originalIcon = button.querySelector('i').className;
                let countdown = timerDuration;
                buttonTextEl.textContent = `Wait ${countdown}s`;
                button.disabled = true;
                
                const timerInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        buttonTextEl.textContent = `Wait ${countdown}s`;
                    } else {
                        clearInterval(timerInterval);
                        button.disabled = false;
                        updateButtonState(button);
                    }
                }, 1000);
            }

            // Process ad unlock flow
            async function processAdUnlock(button) {
                if (isAdInProgress) return;
                
                isAdInProgress = true;
                button.disabled = true;
                
                const buttonTextEl = button.querySelector('span');
                const buttonIconEl = button.querySelector('i');
                const fileId = button.dataset.fileId;
                const requiredCount = parseInt(button.dataset.requiredAds || 1);
                const originalText = buttonTextEl.textContent;
                const originalIcon = buttonIconEl.className;
                
                buttonTextEl.textContent = 'Loading ad...';
                
                try {
                    const result = await showInterstitialAd();
                    
                    if (result.done) {
                        let adCount = parseInt(localStorage.getItem('adCount_' + fileId) || 0);
                        adCount++;
                        localStorage.setItem('adCount_' + fileId, adCount);
                        
                        showToast(`✅ Ad completed! Progress: ${adCount}/${requiredCount}`);
                        
                        if (adCount >= requiredCount) {
                            const expiryTime = Date.now() + (unlockDuration * 60 * 1000);
                            localStorage.setItem('unlock_' + fileId, JSON.stringify({ expiryTime }));
                            showToast(`🎉 Unlocked for ${unlockDuration} minutes!`);
                            
                            // Update button to show Download Now
                            button.disabled = false;
                            buttonTextEl.textContent = 'Download Now';
                            buttonIconEl.className = 'fas fa-download';
                            button.classList.remove('from-blue-500', 'to-purple-600', 'hover:from-blue-600', 'hover:to-purple-700');
                            button.classList.add('from-green-400', 'to-green-600', 'hover:from-green-500', 'hover:to-green-700');
                            
                            // Add timer badge
                            let existingBadge = button.querySelector('.timer-badge');
                            if (!existingBadge) {
                                existingBadge = document.createElement('span');
                                existingBadge.className = 'timer-badge';
                                button.appendChild(existingBadge);
                            }
                            existingBadge.style.display = 'inline-block';
                            
                            startUnlockTimer(fileId, button);
                            
                            // Show the link popup
                            const url = button.dataset.url;
                            if (url) {
                                showLinkPopup(url, fileId);
                            }
                        } else {
                            // Update button with new progress
                            button.disabled = false;
                            buttonTextEl.textContent = `Unlock (${adCount}/${requiredCount})`;
                            buttonIconEl.className = 'fas fa-lock';
                            
                            startCooldownTimer(button);
                        }
                    } else {
                        showToast('⏭️ Ad skipped. Watch full ad for progress.');
                        button.disabled = false;
                        buttonTextEl.textContent = originalText;
                        buttonIconEl.className = originalIcon;
                    }
                } catch (err) {
                    console.error("Ad error:", err);
                    showToast('❌ Could not load ad. Please try again.');
                    button.disabled = false;
                    buttonTextEl.textContent = originalText;
                    buttonIconEl.className = originalIcon;
                }
                
                isAdInProgress = false;
            }

            function handleAccessClick(e) {
                const button = e.target.closest('.access-btn');
                if (!button || button.disabled || isAdInProgress) return;
                
                const fileId = button.dataset.fileId;
                const isUnlocked = checkUnlockExpiry(fileId);
                
                if (isUnlocked) {
                    const url = button.dataset.url;
                    if (url) {
                        showLinkPopup(url, fileId);
                    }
                    return;
                }
                
                processAdUnlock(button);
            }

            // Render banner ad
            function renderBannerAd(containerId, adCode) {
                if (!adCode) return;
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = adCode;
                
                const scripts = Array.from(container.getElementsByTagName('script'));
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }

            // Load banner ads
            async function loadBannerAds() {
                try {
                    const docRef = db.collection("settings").doc("ads");
                    const docSnap = await docRef.get();
                    if (docSnap.exists) {
                        const adData = docSnap.data();
                        renderBannerAd('ad-container-1', adData.adSlot1);
                        renderBannerAd('ad-container-2', adData.adSlot2);
                        renderBannerAd('ad-container-3', adData.adSlot3);
                        console.log("✅ Banner ads loaded");
                    }
                } catch (error) {
                    console.error("Error loading banner ads:", error);
                }
            }

            // Load settings
            async function loadSettings() {
                try {
                    const docRef = db.collection("settings").doc("general");
                    const docSnap = await docRef.get();
                    if (docSnap.exists) {
                        timerDuration = docSnap.data().timerDuration || 10;
                        unlockDuration = docSnap.data().unlockDuration || 10;
                    }
                } catch (error) {
                    console.error("Error loading settings:", error);
                }
            }

            // Load all data
            async function loadAllData() {
                await loadSettings();
                await loadBannerAds();
                
                // Load sliders
                try {
                    const sliderSnapshot = await db.collection("sliders").orderBy("createdAt", "desc").limit(10).get();
                    sliderWrapper.innerHTML = '';
                    sliderDotsContainer.innerHTML = '';
                    const slides = [];
                    
                    sliderSnapshot.forEach(doc => slides.push(doc.data()));
                    
                    if (slides.length > 0) {
                        slides.forEach((slide, index) => {
                            const slideEl = document.createElement('div');
                            slideEl.className = 'slider-item';
                            const imageHTML = `<img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1280x400/e5e7eb/6b7280?text=Slide+${index+1}';">`;
                            slideEl.innerHTML = slide.linkUrl ? `<a href="${slide.linkUrl}" target="_blank" rel="noopener noreferrer">${imageHTML}</a>` : imageHTML;
                            sliderWrapper.appendChild(slideEl);
                            
                            const dotEl = document.createElement('div');
                            dotEl.className = 'slider-dot';
                            dotEl.dataset.index = index;
                            sliderDotsContainer.appendChild(dotEl);
                        });
                        setupSlider(slides.length);
                    } else {
                        sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-gray-200"><p class="text-gray-600">No slides available</p></div>`;
                    }
                } catch (error) {
                    console.error("Error loading sliders:", error);
                    sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-red-100"><p class="text-red-600">Could not load slides</p></div>`;
                }
                
                // Load files
                try {
                    const filesSnapshot = await db.collection("files").orderBy("createdAt", "desc").limit(50).get();
                    filesGrid.innerHTML = '';
                    
                    if (filesSnapshot.empty) {
                        filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No files available</p>`;
                        return;
                    }
                    
                    const files = [];
                    filesSnapshot.forEach(doc => files.push({ id: doc.id, ...doc.data() }));
                    
                    files.forEach(file => {
                        const requiredAds = file.requiredAds || 1;
                        const isUnlocked = checkUnlockExpiry(file.id);
                        const adCount = parseInt(localStorage.getItem('adCount_' + file.id) || 0);
                        
                        const card = document.createElement('div');
                        card.className = 'file-card bg-white rounded-xl shadow-md overflow-hidden card-hover';
                        card.dataset.title = file.title.toLowerCase();
                        card.dataset.description = (file.description || '').toLowerCase();
                        
                        // Determine button classes based on unlock state
                        const btnClasses = isUnlocked 
                            ? 'bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700'
                            : 'bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700';
                        
                        card.innerHTML = `
                            <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full aspect-video object-cover" onerror="this.src='https://placehold.co/400x225/e5e7eb/6b7280?text=File'">
                            <div class="p-4">
                                <h3 class="text-lg font-bold text-gray-900 truncate" title="${file.title}">${file.title}</h3>
                                <p class="text-gray-600 text-sm mt-1 h-10 overflow-hidden">${file.description || 'No description'}</p>
                                <button data-file-id="${file.id}" data-url="${file.downloadUrl}" data-required-ads="${requiredAds}" class="access-btn w-full mt-4 py-2.5 px-4 rounded-lg text-white font-semibold shadow-md flex items-center justify-center gap-2 ${btnClasses}">
                                    <i class="fas ${isUnlocked ? 'fa-download' : 'fa-lock'}"></i>
                                    <span>${isUnlocked ? 'Download Now' : `Unlock (${adCount}/${requiredAds})`}</span>
                                </button>
                            </div>
                        `;
                        
                        filesGrid.appendChild(card);
                        const button = card.querySelector('.access-btn');
                        
                        if (isUnlocked) {
                            const badge = document.createElement('span');
                            badge.className = 'timer-badge';
                            button.appendChild(badge);
                            startUnlockTimer(file.id, button);
                        }
                        
                        // Attach event listener
                        button.addEventListener('click', handleAccessClick);
                    });
                    
                } catch (error) {
                    console.error("Error loading files:", error);
                    filesGrid.innerHTML = `<p class="col-span-full text-center text-red-500 py-8">Could not load files</p>`;
                }
            }

            function setupSlider(slideCount) {
                if (slideCount <= 1) {
                    if (slideCount === 1) {
                        const dot = document.querySelector('.slider-dot');
                        if (dot) dot.classList.add('active');
                    }
                    return;
                }
                
                const dots = document.querySelectorAll('.slider-dot');
                
                function goToSlide(index) {
                    currentSlide = (index + slideCount) % slideCount;
                    sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                    dots.forEach(dot => dot.classList.remove('active'));
                    if (dots[currentSlide]) dots[currentSlide].classList.add('active');
                }
                
                if (sliderInterval) clearInterval(sliderInterval);
                sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3000);
                
                dots.forEach(dot => {
                    dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index)));
                });
                
                goToSlide(0);
            }

            function handleSearch() {
                const term = searchInput.value.toLowerCase();
                let visible = 0;
                
                document.querySelectorAll('.file-card').forEach(card => {
                    const title = card.dataset.title;
                    const desc = card.dataset.description;
                    if (title.includes(term) || desc.includes(term)) {
                        card.style.display = 'block';
                        visible++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                
                if (noResultsMessage) {
                    noResultsMessage.classList.toggle('hidden', visible > 0);
                }
            }

            searchInput.addEventListener('input', handleSearch);

            // Start loading
            loadAllData();
            initAdsGram();
            setTimeout(initAdsGram, 1000);
            setTimeout(initAdsGram, 2000);
            
            // Debug functions
            window.checkAds = () => {
                console.log("AdsGram ready:", adsgramReady);
                console.log("AdController:", AdController);
            };
            
            window.resetAdCounts = () => {
                localStorage.clear();
                console.log("✅ All ad counts reset");
                location.reload();
            };
        })();
    </script>
</body>
</html>
