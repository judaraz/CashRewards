<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .animation-delay-200 { animation-delay: 0.2s; }
        .animation-delay-400 { animation-delay: 0.4s; }
        .slider-container { position: relative; overflow: hidden; }
        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; }
        .slider-item { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .slider-dot { width: 10px; height: 10px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: background-color 0.3s; }
        .slider-dot.active { background-color: white; }
        body { scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        /* Ad Overlay */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .ad-overlay.show { display: flex; }
        .ad-container {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 2px solid #3b82f6;
        }
        .ad-timer {
            font-size: 64px;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }
        
        /* Cooldown overlay on card */
        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            backdrop-filter: blur(2px);
        }
        .file-card {
            position: relative;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Ad Overlay -->
    <div id="adOverlay" class="ad-overlay">
        <div class="ad-container">
            <div class="mb-4">
                <i class="fas fa-ad text-5xl text-blue-500"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Advertisement</h3>
            <p class="text-gray-500 mb-4">Your file is opening in a new tab</p>
            <div id="adTimer" class="ad-timer">5</div>
            <p class="text-sm text-gray-400">Please wait...</p>
            <div class="mt-6">
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="adProgress" class="bg-gradient-to-r from-blue-500 to-purple-600 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="container mx-auto p-4 max-w-7xl">
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-xl shadow-lg mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-center mb-4">Webapp Sikho</h1>
            <p class="text-center text-lg text-blue-100 mb-6">Click Access Now - File Opens + Ad Shows</p>
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search for files..." class="w-full p-3 pl-10 rounded-full bg-white text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300">
                </div>
            </div>
        </header>

        <div id="slider" class="slider-container w-full h-48 md:h-80 bg-gray-300 rounded-xl shadow-lg mb-10 slide-up animation-delay-200">
            <div id="slider-wrapper" class="slider-wrapper h-full">
                <div class="slider-item skeleton w-full h-full"></div>
            </div>
            <div id="slider-dots" class="slider-dots"></div>
        </div>

        <div class="slide-up animation-delay-400">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-4 border-blue-500 pb-2">Available Files</h2>
            <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <i class="fas fa-file-excel text-5xl text-gray-400 mb-4"></i>
                <p class="text-xl text-gray-600">No files found</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white py-3 px-5 rounded-lg shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-50">
        <p id="toast-message"></p>
    </div>

    <footer class="bg-gray-100 py-6 mt-10">
        <div class="container mx-auto px-4">
            <p class="text-center text-gray-600">&copy; 2025 Webapp Sikho. All rights reserved.</p>
        </div>
    </footer>

    <!-- Adsgram SDK -->
    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('no-results');
        const adOverlay = document.getElementById('adOverlay');
        const adTimer = document.getElementById('adTimer');
        const adProgress = document.getElementById('adProgress');

        let sliderInterval;
        let currentSlide = 0;
        let AdController = null;
        let allFiles = [];
        let countdownInterval = null;
        let waitTime = 10; // Default from admin settings
        let adCounter = 0; // For alternating ads
        
        // Cooldown tracking per file
        const fileCooldowns = new Map();

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-10'), 2000);
        }

        // Initialize Adsgram
        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                // Use block ID from admin panel: int-21144
                AdController = window.Adsgram.init({ blockId: "int-21144" });
                console.log("✅ Adsgram ready with block ID: int-21144");
            } else {
                setTimeout(initAdsgram, 500);
            }
        }

        // 🔥 Show Ad - Alternates between interstitial and reward
        function showAd() {
            if (!AdController) return;
            
            adCounter++;
            
            // Alternate between ad types
            if (adCounter % 2 === 1) {
                // Show interstitial
                AdController.show({ type: 'interstitial' }).catch(err => console.log('Interstitial ad error:', err));
            } else {
                // Show reward
                AdController.show({ type: 'reward' }).catch(err => console.log('Reward ad error:', err));
            }
        }

        // 🔥 Show Ad Overlay with countdown
        function showAdOverlay(duration) {
            adOverlay.classList.add('show');
            
            let seconds = duration;
            adTimer.textContent = seconds;
            adProgress.style.width = '0%';
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                seconds--;
                adTimer.textContent = seconds;
                
                const progress = ((duration - seconds) / duration) * 100;
                adProgress.style.width = progress + '%';
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    adOverlay.classList.remove('show');
                }
            }, 1000);
        }

        // 🔥 Start cooldown for a file
        function startCooldown(fileId, card, button, duration) {
            const cooldownKey = `${fileId}_cooldown`;
            const endTime = Date.now() + (duration * 1000);
            localStorage.setItem(cooldownKey, endTime);
            
            // Disable button
            button.disabled = true;
            
            // Show cooldown overlay
            const overlay = document.createElement('div');
            overlay.className = 'cooldown-overlay';
            overlay.id = `cooldown-${fileId}`;
            
            const timerSpan = document.createElement('span');
            timerSpan.className = 'text-white text-2xl font-bold bg-black/50 px-4 py-2 rounded-full';
            timerSpan.id = `cooldown-timer-${fileId}`;
            overlay.appendChild(timerSpan);
            
            card.style.position = 'relative';
            card.appendChild(overlay);
            
            // Update timer
            const updateCooldown = () => {
                const remaining = Math.ceil((endTime - Date.now()) / 1000);
                if (remaining <= 0) {
                    // Cooldown finished
                    const oldOverlay = document.getElementById(`cooldown-${fileId}`);
                    if (oldOverlay) oldOverlay.remove();
                    button.disabled = false;
                    fileCooldowns.delete(fileId);
                    localStorage.removeItem(cooldownKey);
                } else {
                    timerSpan.textContent = remaining + 's';
                    fileCooldowns.set(fileId, setTimeout(updateCooldown, 100));
                }
            };
            
            updateCooldown();
        }

        // 🔥 Check if file is on cooldown
        function isFileOnCooldown(fileId) {
            const cooldownKey = `${fileId}_cooldown`;
            const endTime = localStorage.getItem(cooldownKey);
            if (endTime && parseInt(endTime) > Date.now()) {
                return true;
            }
            return false;
        }

        // 🔥 Open file + show ad + start cooldown
        async function handleAccessClick(fileId, url, button, card) {
            if (button.disabled) return;
            
            // Check cooldown
            if (isFileOnCooldown(fileId)) {
                showToast('⏳ Please wait for cooldown to finish');
                return;
            }
            
            // Open file immediately
            showToast('📥 Opening file...');
            window.open(url, '_blank');
            
            // Show ad (Adsgram interstitial/reward)
            showAd();
            
            // Show ad overlay with wait time
            showAdOverlay(waitTime);
            
            // Start cooldown
            startCooldown(fileId, card, button, waitTime);
        }

        // Load wait time from admin settings
        async function loadSettings() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "general"));
                if (docSnap.exists()) {
                    waitTime = docSnap.data().timerDuration || 10;
                    console.log(`⏱️ Wait time loaded: ${waitTime}s`);
                }
            } catch (error) {
                console.error("Error loading settings:", error);
            }
        }

        // Load all data
        async function loadAllData() {
            try {
                await loadSettings();
                
                const [slidersSnap, filesSnap] = await Promise.all([
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(10))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(50)))
                ]);
                
                renderSliders(slidersSnap);
                renderFiles(filesSnap);
            } catch (error) {
                console.error("Error loading:", error);
                sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-red-100"><p class="text-red-600">Could not load slides.</p></div>`;
                filesGrid.innerHTML = `<p class="col-span-full text-center text-red-500">Could not load files.</p>`;
            }
        }

        function renderSliders(sliderSnapshot) {
            sliderWrapper.innerHTML = '';
            sliderDotsContainer.innerHTML = '';
            const slides = [];
            sliderSnapshot.forEach(doc => slides.push(doc.data()));
            
            if (slides.length > 0) {
                slides.forEach((slide, index) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = 'slider-item';
                    slideEl.innerHTML = slide.linkUrl ? 
                        `<a href="${slide.linkUrl}" target="_blank"><img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1280x400'"></a>` :
                        `<img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1280x400'">`;
                    sliderWrapper.appendChild(slideEl);
                    
                    const dotEl = document.createElement('div');
                    dotEl.className = 'slider-dot';
                    dotEl.dataset.index = index;
                    sliderDotsContainer.appendChild(dotEl);
                });
                setupSlider(slides.length);
            }
        }

        function renderFiles(filesSnapshot) {
            filesGrid.innerHTML = '';
            allFiles = [];
            
            if (filesSnapshot.empty) {
                filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No files available.</p>`;
                return;
            }
            
            filesSnapshot.forEach(doc => allFiles.push({ id: doc.id, ...doc.data() }));
            
            allFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow';
                card.dataset.title = file.title.toLowerCase();
                card.dataset.description = (file.description || '').toLowerCase();
                card.id = `card-${file.id}`;
                
                const isOnCooldown = isFileOnCooldown(file.id);
                
                card.innerHTML = `
                    <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full aspect-video object-cover" onerror="this.src='https://placehold.co/400x225'">
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-gray-900 truncate">${file.title}</h3>
                        <p class="text-gray-600 text-sm mt-1 h-10 overflow-hidden">${file.description || ''}</p>
                        <div class="mt-3">
                            <button data-file-id="${file.id}" data-url="${file.downloadUrl}" class="access-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 flex items-center justify-center gap-2" ${isOnCooldown ? 'disabled' : ''}>
                                <i class="fas fa-download"></i>
                                <span>${isOnCooldown ? 'Wait...' : 'Access Now'}</span>
                            </button>
                        </div>
                    </div>
                `;
                filesGrid.appendChild(card);
                
                // If on cooldown, restore the overlay
                if (isOnCooldown) {
                    const button = card.querySelector('.access-btn');
                    startCooldown(file.id, card, button, waitTime);
                }
            });
        }

        function setupSlider(slideCount) {
            if (slideCount <= 1) {
                if(slideCount === 1) document.querySelector('.slider-dot')?.classList.add('active');
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            function goToSlide(index) {
                currentSlide = (index + slideCount) % slideCount;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3000);
            dots.forEach(dot => dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index))));
            goToSlide(0);
        }

        function handleSearch() {
            const term = searchInput.value.toLowerCase();
            let visible = 0;
            
            document.querySelectorAll('.file-card').forEach(card => {
                const title = card.dataset.title;
                const desc = card.dataset.description;
                if (title.includes(term) || desc.includes(term)) {
                    card.style.display = 'block';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            noResultsMessage.classList.toggle('hidden', visible > 0);
        }

        // Handle click
        filesGrid.addEventListener('click', (e) => {
            const accessBtn = e.target.closest('.access-btn');
            if (accessBtn && !accessBtn.disabled) {
                e.preventDefault();
                const fileId = accessBtn.dataset.fileId;
                const url = accessBtn.dataset.url;
                const card = accessBtn.closest('.file-card');
                
                handleAccessClick(fileId, url, accessBtn, card);
            }
        });

        searchInput.addEventListener('input', handleSearch);

        // Start
        loadAllData();
        initAdsgram();
    </script>
</body>
</html>
