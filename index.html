<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a0f 0%,#1a0a1a 50%,#0f0a1a 100%);
            font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        }
        .glass{
            background:rgba(15,15,25,0.85);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(236,72,153,0.15);
        }
        .gradient-premium{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
        .gradient-unlocked{background:linear-gradient(135deg,#10b981,#059669)}
        .slider-wrapper{display:flex;transition:transform .5s;will-change:transform}
        .slider-item{min-width:100%}
        .slider-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all .3s;cursor:pointer}
        .slider-dot.active{width:24px;border-radius:12px;background:linear-gradient(90deg,#ec4899,#8b5cf6)}
        .skeleton{background:linear-gradient(90deg,#1a1a2a 25%,#2a2a3a 50%,#1a1a2a 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        button:disabled{opacity:0.6;cursor:not-allowed}
        
        /* Simple ad modal */
        .ad-modal{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.9);
            z-index:1000;
            display:none;
            align-items:center;
            justify-content:center;
        }
        .ad-modal.show{display:flex}
        .ad-box{
            background:#1a1a2e;
            border-radius:20px;
            padding:30px;
            max-width:350px;
            width:90%;
            text-align:center;
            border:1px solid #ec4899;
        }
        .countdown-number{
            font-size:60px;
            font-weight:bold;
            background:linear-gradient(135deg,#ec4899,#8b5cf6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
    </style>
</head>
<body class="text-gray-100">

    <!-- Simple Ad Modal -->
    <div id="adModal" class="ad-modal">
        <div class="ad-box">
            <i class="fas fa-ad text-4xl text-pink-400 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Advertisement</h3>
            <p class="text-gray-400 text-sm mb-4">Watch ad to unlock content</p>
            <div id="countdownDisplay" class="countdown-number">5</div>
            <p class="text-xs text-gray-500 mt-4">Please wait...</p>
        </div>
    </div>

    <div id="app" class="container mx-auto px-4 py-4 max-w-7xl">
        
        <!-- Header -->
        <header class="mb-6">
            <div class="glass rounded-2xl p-5 border border-pink-500/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
                        <i class="fas fa-crown text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black">
                            <span class="bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">Premium</span>
                            <span class="text-white">Hub</span>
                        </h1>
                        <p class="text-gray-400 text-xs">Exclusive Content • VIP Access</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Grid -->
        <div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-1 h-6 bg-gradient-to-b from-pink-500 to-purple-600 rounded-full"></div>
                <h2 class="text-xl font-black text-white">Premium Content</h2>
            </div>
            
            <div id="files-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
                <div class="skeleton rounded-xl h-56"></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 glass px-5 py-3 rounded-xl opacity-0 transition-all duration-300 z-50">
        <p id="toast-message" class="text-sm"></p>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            databaseURL: "https://visit-1f400-default-rtdb.firebaseio.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const filesGrid = document.getElementById('files-grid');
        const adModal = document.getElementById('adModal');
        const countdownDisplay = document.getElementById('countdownDisplay');
        
        let allFiles = [];
        let currentBtn = null;
        let countdownInterval = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        // 🔥 SIMPLE: Just show ad and countdown
        function showAdAndCountdown(btn, fileId, required) {
            currentBtn = btn;
            adModal.classList.add('show');
            
            let seconds = 5;
            countdownDisplay.textContent = seconds;
            
            // Try to show Adsgram (optional)
            if (typeof window.Adsgram !== 'undefined') {
                window.Adsgram.init({ blockId: "21145" }).show().catch(() => {});
            }
            
            // Simple countdown
            countdownInterval = setInterval(() => {
                seconds--;
                countdownDisplay.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    adModal.classList.remove('show');
                    
                    // Reward user
                    let watched = parseInt(localStorage.getItem(`adCount_${fileId}`) || 0);
                    watched++;
                    localStorage.setItem(`adCount_${fileId}`, watched);
                    
                    if (watched >= required) {
                        showToast('🎉 Content Unlocked!');
                        updateCardToUnlocked(fileId);
                    } else {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = `Watch Ad (${watched}/${required})`;
                        document.querySelector(`#badge-${fileId} .ad-count`).textContent = `${watched}/${required}`;
                        showToast(`Progress: ${watched}/${required}`);
                    }
                }
            }, 1000);
        }

        function updateCardToUnlocked(fileId) {
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;
            
            document.getElementById(`badge-${fileId}`).innerHTML = `
                <span class="gradient-unlocked px-2 py-1 rounded-lg text-xs font-bold">
                    <i class="fas fa-check mr-1"></i>UNLOCKED
                </span>
            `;
            
            document.getElementById(`btn-container-${fileId}`).innerHTML = `
                <button data-file-url="${file.downloadUrl}" 
                        class="open-btn w-full py-2.5 px-3 rounded-lg text-white text-sm font-semibold gradient-unlocked">
                    <i class="fas fa-unlock"></i> Access Now
                </button>
            `;
        }

        async function loadFiles() {
            try {
                const snapshot = await getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(40)));
                filesGrid.innerHTML = '';
                allFiles = [];
                
                snapshot.forEach(d => allFiles.push({ id: d.id, ...d.data() }));
                
                allFiles.forEach(f => {
                    const required = f.requiredAds || 5;
                    const watched = parseInt(localStorage.getItem(`adCount_${f.id}`) || 0);
                    const unlocked = watched >= required;
                    
                    const card = document.createElement('div');
                    card.className = 'file-card glass rounded-xl overflow-hidden border border-pink-500/20';
                    card.innerHTML = `
                        <div class="relative aspect-[4/5]">
                            <img src="${f.thumbnailUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x600/1a1a2e/ec4899?text=Premium'">
                            <div class="absolute top-2 right-2" id="badge-${f.id}">
                                ${!unlocked ? `
                                    <span class="bg-black/70 px-2 py-1 rounded-lg text-xs border border-pink-500/40 text-pink-300">
                                        <i class="fas fa-lock mr-1"></i><span class="ad-count">${watched}/${required}</span>
                                    </span>
                                ` : `
                                    <span class="gradient-unlocked px-2 py-1 rounded-lg text-xs">
                                        <i class="fas fa-check mr-1"></i>UNLOCKED
                                    </span>
                                `}
                            </div>
                            <div class="absolute top-2 left-2">
                                <span class="bg-gradient-to-r from-pink-500/90 to-purple-600/90 px-2 py-1 rounded-lg text-[10px]">
                                    <i class="fas fa-crown mr-1"></i>PREMIUM
                                </span>
                            </div>
                            <div class="absolute bottom-0 left-0 right-0 p-3">
                                <h3 class="font-bold text-sm text-white">${f.title}</h3>
                            </div>
                        </div>
                        <div class="p-3">
                            <p class="text-gray-400 text-xs mb-3">${f.description}</p>
                            <div id="btn-container-${f.id}">
                                ${!unlocked ? `
                                    <button data-file-id="${f.id}" data-required="${required}" 
                                            class="unlock-btn w-full py-2.5 rounded-lg text-white text-sm gradient-premium">
                                        <i class="fas fa-play-circle mr-2"></i>
                                        <span class="btn-text">Watch Ad (${watched}/${required})</span>
                                    </button>
                                ` : `
                                    <button data-file-url="${f.downloadUrl}" 
                                            class="open-btn w-full py-2.5 rounded-lg text-white text-sm gradient-unlocked">
                                        <i class="fas fa-unlock mr-2"></i>Access Now
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                    filesGrid.appendChild(card);
                });
            } catch (e) {
                console.error("Load error:", e);
            }
        }

        // Handle clicks
        filesGrid.addEventListener('click', (e) => {
            const unlockBtn = e.target.closest('.unlock-btn');
            const openBtn = e.target.closest('.open-btn');
            
            if (unlockBtn && !unlockBtn.disabled) {
                unlockBtn.disabled = true;
                showAdAndCountdown(unlockBtn, unlockBtn.dataset.fileId, parseInt(unlockBtn.dataset.required));
            } else if (openBtn) {
                window.open(openBtn.dataset.fileUrl, '_blank');
            }
        });

        // Initialize
        loadFiles();
        
        // Load Adsgram (optional)
        if (typeof window.Adsgram === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://sad.adsgram.ai/js/sad.min.js';
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
