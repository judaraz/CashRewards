<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LUDO DICE | Win Points with Ads</title>
    
    <!-- Adexium Widget SDK -->
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Game Container */
        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
        }
        
        .game-subtitle {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        /* Balance Card */
        .balance-card {
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4));
            border-radius: 32px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(4px);
        }
        
        .balance-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .balance-amount {
            font-size: 2rem;
            font-weight: 800;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .balance-unit {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-left: 4px;
        }
        
        /* Ludo Board */
        .ludo-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fef9e8;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 20px 35px -10px black;
            margin-bottom: 20px;
            overflow: hidden;
            border: 4px solid #2d2b26;
        }
        
        .board-inner {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background: #2d2b26;
            padding: 2px;
        }
        
        .cell {
            background: #fef9e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #b45309;
        }
        
        .corner-red { background: #ef4444; }
        .corner-green { background: #10b981; }
        .corner-yellow { background: #f59e0b; }
        .corner-blue { background: #3b82f6; }
        
        .center-piece {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%;
            height: 28%;
            background: #fef9e8;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #92400e;
            border: 3px solid #2d2b26;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }
        
        /* Dice Display */
        .dice-area {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        
        .dice-cube {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 900;
            color: #1e293b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid #FFD700;
            transition: transform 0.2s ease;
        }
        
        .dice-rolling {
            animation: diceShake 0.2s infinite;
        }
        
        @keyframes diceShake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        
        /* Roll Button */
        .roll-btn {
            width: 100%;
            background: linear-gradient(135deg, #facc15, #eab308);
            border: none;
            padding: 16px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 60px;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(250, 204, 21, 0.4);
        }
        
        .roll-btn:active {
            transform: scale(0.96);
        }
        
        .roll-btn.disabled {
            background: #4b5563;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }
        
        /* Game Info */
        .game-info {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }
        
        .win-multiplier {
            color: #FFD700;
            font-weight: bold;
            font-size: 1rem;
        }
        
        .game-cost {
            color: #facc15;
            font-weight: bold;
        }
        
        .countdown-timer {
            font-size: 0.8rem;
            color: #ffaa44;
            margin-top: 8px;
        }
        
        .ad-status {
            font-size: 0.7rem;
            background: #1e293b;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 8px;
            color: #94a3b8;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
        }
        
        .modal.active {
            visibility: visible;
            opacity: 1;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 48px;
            padding: 30px;
            max-width: 340px;
            width: 85%;
            text-align: center;
            border: 2px solid #facc15;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }
        
        .dice-result-face {
            font-size: 5rem;
            margin: 15px 0;
        }
        
        .win-amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: #4ade80;
            margin: 10px 0;
        }
        
        .claim-btn {
            background: linear-gradient(135deg, #facc15, #eab308);
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        
        .claim-btn:disabled {
            background: #475569;
            cursor: wait;
        }
        
        .close-modal {
            margin-top: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        /* Ad Loading */
        .ad-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            visibility: hidden;
            flex-direction: column;
            gap: 20px;
        }
        
        .ad-loading.active {
            visibility: visible;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #facc15;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 1200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border-left: 4px solid #facc15;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .play-limit {
            font-size: 0.7rem;
            color: #86efac;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="game-title">🎲 LUDO DICE 🎲</div>
        <div class="game-subtitle">Roll the dice, watch ads, win big!</div>
    </div>
    
    <div class="balance-card">
        <span class="balance-label">💰 YOUR POINTS</span>
        <div>
            <span class="balance-amount" id="balanceDisplay">500</span>
            <span class="balance-unit">pts</span>
        </div>
    </div>
    
    <!-- Ludo Themed Board -->
    <div class="ludo-board">
        <div class="board-inner">
            <div class="cell corner-red">⭐</div>
            <div class="cell"></div>
            <div class="cell corner-green">⭐</div>
            <div class="cell"></div>
            <div class="cell" style="background: #fef9e8;"></div>
            <div class="cell"></div>
            <div class="cell corner-yellow">⭐</div>
            <div class="cell"></div>
            <div class="cell corner-blue">⭐</div>
        </div>
        <div class="center-piece">LUDO</div>
    </div>
    
    <div class="dice-area">
        <div class="dice-cube" id="diceDisplay">⚅</div>
    </div>
    
    <button class="roll-btn" id="rollBtn">
        <span>🎲</span> ROLL DICE - <span id="gameCostSpan">10</span> POINTS
    </button>
    
    <div class="game-info">
        <div class="win-multiplier">✨ WIN MULTIPLIER: Dice Result × 10 = Points! ✨</div>
        <div class="game-cost" id="costInfo">Cost per roll: 10 points</div>
        <div id="countdownArea" class="countdown-timer"></div>
        <div class="ad-status" id="adStatusBadge">✅ Ads Ready</div>
        <div class="play-limit" id="limitDisplay"></div>
    </div>
</div>

<!-- Result Modal -->
<div id="resultModal" class="modal">
    <div class="modal-content">
        <div style="font-size: 2rem;">🎲</div>
        <div class="dice-result-face" id="modalDiceFace">⚅</div>
        <div class="win-amount" id="modalWinAmount">0 POINTS</div>
        <button id="claimRewardBtn" class="claim-btn">🎬 WATCH ADS & CLAIM</button>
        <button id="closeModalBtn" class="close-modal">Close</button>
    </div>
</div>

<!-- Ad Loading Overlay -->
<div id="adLoadingOverlay" class="ad-loading">
    <div class="spinner"></div>
    <div style="color: #facc15;">Loading advertisement...</div>
    <div style="font-size: 0.8rem; color: #94a3b8;" id="adProviderText">Provider: Adexium/AdsGram</div>
</div>

<!-- Toast Message -->
<div id="toastMsg" class="toast">Message</div>

<script>
    // ==================== GAME STATE ====================
    let userPoints = 500;          // Starting points
    let currentDiceValue = 6;
    let currentWinAmount = 0;
    let isRolling = false;
    let rollDisabled = false;
    let countdownInterval = null;
    let lastRollTime = 0;
    
    // Game config
    const GAME_COST = 10;
    const WIN_MULTIPLIER = 10;
    const COOLDOWN_SECONDS = 8;     // 8 seconds cooldown after each roll
    
    // Daily play limit
    let todayPlays = 0;
    const DAILY_LIMIT = 20;
    
    // ==================== ADS SDK VARIABLES ====================
    let adsGramReward = null;
    let adsGramInterstitial = null;
    let adexiumInterstitialWidget = null;
    let currentAdPromise = null;
    
    // ==================== INIT ADS SDK ====================
    function initAdSDKs() {
        console.log("🎯 Initializing AdsGram & Adexium...");
        
        // AdsGram Reward (Block ID: 21145)
        if (typeof window.Adsgram !== 'undefined') {
            try {
                adsGramReward = window.Adsgram.init({ blockId: "21145" });
                adsGramInterstitial = window.Adsgram.init({ blockId: "int-21144" });
                console.log("✅ AdsGram SDK initialized (Reward & Interstitial)");
            } catch(e) { console.error("AdsGram init error:", e); }
        } else {
            console.warn("⚠️ AdsGram SDK not loaded");
        }
        
        // Adexium Widget - Interstitial
        if (typeof AdexiumWidget !== 'undefined') {
            try {
                adexiumInterstitialWidget = new AdexiumWidget({ 
                    wid: 'f2c903be-ac1d-4f6b-b0c7-8a281363517e', 
                    adFormat: 'interstitial' 
                });
                adexiumInterstitialWidget.autoMode();
                console.log("✅ Adexium Interstitial initialized");
            } catch(e) { console.error("Adexium init error:", e); }
        } else {
            console.warn("⚠️ Adexium SDK not loaded");
        }
        
        updateAdStatusBadge(true);
    }
    
    function updateAdStatusBadge(ready) {
        const badge = document.getElementById('adStatusBadge');
        if (ready) {
            badge.innerHTML = "✅ Ads Ready (Adexium + AdsGram)";
            badge.style.color = "#86efac";
        } else {
            badge.innerHTML = "⚠️ Ads Loading...";
            badge.style.color = "#facc15";
        }
    }
    
    // ==================== SHOW AD (PRIORITY: AdsGram Reward → AdsGram Interstitial → Adexium) ====================
    async function showAdForReward() {
        updateAdProviderText("Loading ad...");
        showAdLoading(true);
        
        // Try AdsGram Reward Ad first
        if (adsGramReward) {
            try {
                console.log("🎬 Trying AdsGram Reward Ad...");
                updateAdProviderText("Provider: AdsGram Reward");
                const result = await adsGramReward.show();
                if (result && result.done) {
                    console.log("✅ AdsGram Reward Ad completed");
                    showAdLoading(false);
                    return true;
                }
            } catch (err) {
                console.log("AdsGram Reward failed:", err);
            }
        }
        
        // Try AdsGram Interstitial Ad second
        if (adsGramInterstitial) {
            try {
                console.log("🎬 Trying AdsGram Interstitial Ad...");
                updateAdProviderText("Provider: AdsGram Interstitial");
                const result = await adsGramInterstitial.show();
                if (result && result.done) {
                    console.log("✅ AdsGram Interstitial Ad completed");
                    showAdLoading(false);
                    return true;
                }
            } catch (err) {
                console.log("AdsGram Interstitial failed:", err);
            }
        }
        
        // Try Adexium Interstitial third
        if (adexiumInterstitialWidget && typeof adexiumInterstitialWidget.show === 'function') {
            try {
                console.log("🎬 Trying Adexium Interstitial Ad...");
                updateAdProviderText("Provider: Adexium Interstitial");
                
                // Create a promise for Adexium (since it uses events)
                const adexiumPromise = new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error("Adexium timeout")), 15000);
                    
                    const onComplete = () => {
                        clearTimeout(timeout);
                        window.removeEventListener('adexiumInterstitialCompleted', onComplete);
                        resolve(true);
                    };
                    
                    window.addEventListener('adexiumInterstitialCompleted', onComplete, { once: true });
                    
                    // Show Adexium ad
                    const container = document.createElement('div');
                    container.style.position = 'fixed';
                    container.style.top = '0';
                    container.style.left = '0';
                    container.style.width = '100%';
                    container.style.height = '100%';
                    container.style.zIndex = '2000';
                    container.style.backgroundColor = 'rgba(0,0,0,0.9)';
                    container.style.display = 'flex';
                    container.style.alignItems = 'center';
                    container.style.justifyContent = 'center';
                    document.body.appendChild(container);
                    
                    adexiumInterstitialWidget.show();
                    
                    // Simulate close after showing (Adexium will trigger event)
                    setTimeout(() => {
                        if (container) container.remove();
                    }, 500);
                    
                    // Fallback in case event doesn't fire
                    setTimeout(() => {
                        if (container) container.remove();
                        clearTimeout(timeout);
                        resolve(true);
                    }, 8000);
                });
                
                const result = await adexiumPromise;
                showAdLoading(false);
                return true;
            } catch (err) {
                console.log("Adexium interstitial failed:", err);
            }
        }
        
        showAdLoading(false);
        console.log("❌ All ad providers failed");
        return false;
    }
    
    function showAdLoading(show) {
        const overlay = document.getElementById('adLoadingOverlay');
        if (show) overlay.classList.add('active');
        else overlay.classList.remove('active');
    }
    
    function updateAdProviderText(text) {
        const el = document.getElementById('adProviderText');
        if (el) el.textContent = text;
    }
    
    // ==================== GAME MECHANICS ====================
    function getRandomDiceValue() {
        // Weighted: 1-3 common, 4-5 less common, 6 rare but exciting
        const r = Math.random() * 100;
        if (r < 70) return Math.floor(Math.random() * 3) + 1;      // 1-3 (70%)
        else if (r < 92) return Math.floor(Math.random() * 2) + 4; // 4-5 (22%)
        else return 6;                                             // 6 (8%)
    }
    
    function animateRoll(callback) {
        let rolls = 0;
        const maxRolls = 12;
        const diceElement = document.getElementById('diceDisplay');
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        
        function step() {
            if (rolls < maxRolls) {
                const randomVal = Math.floor(Math.random() * 6) + 1;
                diceElement.textContent = diceFaces[randomVal - 1];
                diceElement.classList.add('dice-rolling');
                rolls++;
                setTimeout(step, 70);
            } else {
                diceElement.classList.remove('dice-rolling');
                const finalVal = getRandomDiceValue();
                currentDiceValue = finalVal;
                diceElement.textContent = diceFaces[finalVal - 1];
                callback(finalVal);
            }
        }
        step();
    }
    
    function startCooldown() {
        rollDisabled = true;
        const rollBtn = document.getElementById('rollBtn');
        const countdownArea = document.getElementById('countdownArea');
        let secondsLeft = COOLDOWN_SECONDS;
        
        rollBtn.classList.add('disabled');
        countdownArea.innerHTML = `⏳ Wait ${secondsLeft}s before next roll...`;
        
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                rollDisabled = false;
                rollBtn.classList.remove('disabled');
                countdownArea.innerHTML = '';
                updateRollButtonText();
            } else {
                countdownArea.innerHTML = `⏳ Wait ${secondsLeft}s before next roll...`;
            }
        }, 1000);
    }
    
    function updateRollButtonText() {
        const span = document.getElementById('gameCostSpan');
        if (span) span.textContent = GAME_COST;
    }
    
    function deductPoints(amount) {
        if (userPoints >= amount) {
            userPoints -= amount;
            updateBalanceUI();
            return true;
        }
        return false;
    }
    
    function addPoints(amount) {
        userPoints += amount;
        updateBalanceUI();
    }
    
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = userPoints;
    }
    
    function checkDailyLimit() {
        const today = new Date().toDateString();
        const storedDate = localStorage.getItem('ludo_last_play_date');
        const storedPlays = localStorage.getItem('ludo_today_plays');
        
        if (storedDate !== today) {
            localStorage.setItem('ludo_last_play_date', today);
            localStorage.setItem('ludo_today_plays', '0');
            todayPlays = 0;
        } else {
            todayPlays = parseInt(storedPlays || '0');
        }
        
        const limitDisplay = document.getElementById('limitDisplay');
        if (DAILY_LIMIT > 0) {
            limitDisplay.innerHTML = `📅 Today: ${todayPlays}/${DAILY_LIMIT} plays`;
            if (todayPlays >= DAILY_LIMIT) {
                limitDisplay.style.color = "#f87171";
                return false;
            } else {
                limitDisplay.style.color = "#86efac";
            }
        }
        return true;
    }
    
    function incrementDailyPlay() {
        const today = new Date().toDateString();
        localStorage.setItem('ludo_last_play_date', today);
        const newCount = todayPlays + 1;
        localStorage.setItem('ludo_today_plays', newCount.toString());
        todayPlays = newCount;
        checkDailyLimit();
    }
    
    // ==================== SHOW RESULT MODAL & HANDLE AD REWARD ====================
    function showResultModal(diceValue, winPoints) {
        const modal = document.getElementById('resultModal');
        const modalDiceFace = document.getElementById('modalDiceFace');
        const modalWinAmount = document.getElementById('modalWinAmount');
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        
        modalDiceFace.textContent = diceFaces[diceValue - 1];
        modalWinAmount.textContent = `${winPoints} POINTS`;
        modal.classList.add('active');
    }
    
    async function handleClaimReward() {
        const claimBtn = document.getElementById('claimRewardBtn');
        const modal = document.getElementById('resultModal');
        
        claimBtn.disabled = true;
        claimBtn.innerHTML = '⏳ LOADING AD...';
        
        try {
            // Show ad and wait for completion
            const adSuccess = await showAdForReward();
            
            if (adSuccess) {
                // Add win points to user balance
                addPoints(currentWinAmount);
                showToast(`🎉 You earned ${currentWinAmount} points!`, "success");
                
                // Record play & cooldown
                incrementDailyPlay();
                startCooldown();
                
                modal.classList.remove('active');
            } else {
                // No ad available -> refund cost
                addPoints(GAME_COST);
                showToast("⚠️ No ads available. Your points have been refunded.", "warning");
                modal.classList.remove('active');
            }
        } catch (err) {
            console.error("Ad error:", err);
            addPoints(GAME_COST);
            showToast("⚠️ Ad error. Points refunded.", "error");
            modal.classList.remove('active');
        } finally {
            claimBtn.disabled = false;
            claimBtn.innerHTML = '🎬 WATCH ADS & CLAIM';
            isRolling = false;
        }
    }
    
    // ==================== ROLL DICE MAIN ====================
    async function rollDice() {
        if (isRolling || rollDisabled) {
            showToast("Please wait for cooldown!", "warning");
            return;
        }
        
        // Check daily limit
        if (!checkDailyLimit()) {
            showToast(`❌ Daily limit reached (${DAILY_LIMIT} plays). Come back tomorrow!`, "error");
            return;
        }
        
        // Check balance
        if (userPoints < GAME_COST) {
            showToast(`❌ Not enough points! Need ${GAME_COST} points.`, "error");
            return;
        }
        
        isRolling = true;
        const rollBtn = document.getElementById('rollBtn');
        rollBtn.classList.add('disabled');
        
        // Deduct cost
        deductPoints(GAME_COST);
        
        // Animate dice
        animateRoll((diceValue) => {
            currentDiceValue = diceValue;
            currentWinAmount = diceValue * WIN_MULTIPLIER;
            
            // Show result modal with win amount
            showResultModal(diceValue, currentWinAmount);
            
            // Roll completed, but we don't add points yet - user must watch ad
            rollBtn.classList.remove('disabled');
            isRolling = false;
        });
    }
    
    // ==================== TOAST & UTILS ====================
    function showToast(message, type = "info") {
        const toast = document.getElementById('toastMsg');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
    
    // ==================== LOAD SAVED DATA (localStorage) ====================
    function loadSavedData() {
        const savedPoints = localStorage.getItem('ludo_user_points');
        if (savedPoints && !isNaN(parseInt(savedPoints))) {
            userPoints = parseInt(savedPoints);
        } else {
            userPoints = 500;
        }
        updateBalanceUI();
        
        // Load daily plays
        const today = new Date().toDateString();
        const storedDate = localStorage.getItem('ludo_last_play_date');
        const storedPlays = localStorage.getItem('ludo_today_plays');
        if (storedDate === today && storedPlays) {
            todayPlays = parseInt(storedPlays);
        } else {
            todayPlays = 0;
            localStorage.setItem('ludo_last_play_date', today);
            localStorage.setItem('ludo_today_plays', '0');
        }
        checkDailyLimit();
    }
    
    function savePoints() {
        localStorage.setItem('ludo_user_points', userPoints);
    }
    
    // Auto-save points on any change
    function autoSave() {
        savePoints();
    }
    
    // Override addPoints and deductPoints to auto-save
    const originalAdd = addPoints;
    const originalDeduct = deductPoints;
    addPoints = function(amount) {
        originalAdd(amount);
        autoSave();
    };
    deductPoints = function(amount) {
        const result = originalDeduct(amount);
        autoSave();
        return result;
    };
    
    // ==================== EVENT LISTENERS ====================
    function bindEvents() {
        const rollBtn = document.getElementById('rollBtn');
        const claimBtn = document.getElementById('claimRewardBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modal = document.getElementById('resultModal');
        
        rollBtn.addEventListener('click', rollDice);
        claimBtn.addEventListener('click', handleClaimReward);
        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            // If modal closed without claiming, refund? Better to refund if they exit without ad.
            if (!isRolling && currentWinAmount > 0) {
                addPoints(GAME_COST);
                showToast("Game cancelled, points refunded.", "info");
                currentWinAmount = 0;
            }
            isRolling = false;
        });
        
        // Also if user clicks outside? Not needed, but good UX
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                if (currentWinAmount > 0) {
                    addPoints(GAME_COST);
                    showToast("Game cancelled, points refunded.", "info");
                    currentWinAmount = 0;
                }
                isRolling = false;
            }
        });
    }
    
    // ==================== INITIALIZE GAME ====================
    function initGame() {
        loadSavedData();
        initAdSDKs();
        bindEvents();
        updateRollButtonText();
        updateBalanceUI();
        console.log("🎮 Ludo Dice Game Ready!");
    }
    
    // Start everything
    initGame();
    
    // Expose for debugging (optional)
    window.debugGame = { userPoints, rollDice };
</script>
</body>
</html>
