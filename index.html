<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
        .animation-delay-200 { animation-delay: 0.2s; }
        .animation-delay-400 { animation-delay: 0.4s; }
        .slider-container { position: relative; overflow: hidden; }
        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; }
        .slider-item { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .slider-dot { width: 10px; height: 10px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: background-color 0.3s; }
        .slider-dot.active { background-color: white; }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .ad-popup {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .ad-popup.show { display: flex; }
        .ad-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="adPopup" class="ad-popup">
        <div class="ad-box">
            <i class="fas fa-ad text-5xl text-blue-500 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Advertisement</h3>
            <p class="text-gray-500 text-sm mb-4">Please wait...</p>
            <div id="adTimer" class="text-5xl font-bold text-blue-600 my-4">5</div>
            <button id="skipAdBtn" class="w-full py-2 bg-gray-200 rounded-lg text-gray-700 hover:bg-gray-300 transition">
                Skip Ad
            </button>
        </div>
    </div>

    <div id="app" class="container mx-auto p-4 max-w-7xl">
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-xl shadow-lg mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-center mb-4">Webapp Sikho</h1>
            <p class="text-center text-lg text-blue-100 mb-6">Watch Ad, Get Your File!</p>
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search for files..." class="w-full p-3 pl-10 rounded-full bg-white text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300">
                </div>
            </div>
        </header>

        <div id="slider" class="slider-container w-full h-48 md:h-80 bg-gray-300 rounded-xl shadow-lg mb-10 slide-up animation-delay-200">
            <div id="slider-wrapper" class="slider-wrapper h-full">
                <div class="slider-item skeleton w-full h-full"></div>
            </div>
            <div id="slider-dots" class="slider-dots"></div>
        </div>

        <div class="slide-up animation-delay-400">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-4 border-blue-500 pb-2">Available Files</h2>
            <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
                <div class="skeleton rounded-xl h-64"></div>
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <i class="fas fa-file-excel text-5xl text-gray-400 mb-4"></i>
                <p class="text-xl text-gray-600">No files found</p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white py-3 px-5 rounded-lg shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-50">
        <p id="toast-message"></p>
    </div>

    <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtqQvDCgqy5Tp01yajerWRSMfW6MKx-Gc",
            authDomain: "visit-1f400.firebaseapp.com",
            projectId: "visit-1f400",
            storageBucket: "visit-1f400.firebasestorage.app",
            messagingSenderId: "226827389556",
            appId: "1:226827389556:web:b5c04719721212bc79df21"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sliderWrapper = document.getElementById('slider-wrapper');
        const sliderDotsContainer = document.getElementById('slider-dots');
        const filesGrid = document.getElementById('files-grid');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('no-results');
        const adPopup = document.getElementById('adPopup');
        const adTimer = document.getElementById('adTimer');
        const skipAdBtn = document.getElementById('skipAdBtn');

        let sliderInterval;
        let currentSlide = 0;
        let AdController = null;
        let allFiles = [];
        let pendingUrl = null;
        let countdownInterval = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-10'), 2000);
        }

        function initAdsgram() {
            if (typeof window.Adsgram !== 'undefined') {
                AdController = window.Adsgram.init({ blockId: "21145" });
                console.log("✅ Adsgram ready");
            }
        }

        // 🔥 FIXED: Open file - guaranteed to work
        function openFile(url) {
            console.log('🔗 Opening URL:', url);
            if (!url) {
                console.error('❌ No URL provided!');
                showToast('Error: No file URL');
                return;
            }
            
            showToast('📥 Opening file...');
            
            // Try multiple methods to open
            try {
                // Method 1: window.open
                const newWindow = window.open(url, '_blank');
                
                // Method 2: If blocked, use anchor tag
                if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                    console.log('⚠️ Popup blocked, using anchor fallback');
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            } catch (e) {
                console.error('❌ Error opening file:', e);
                // Method 3: Direct location
                window.location.href = url;
            }
        }

        // 🔥 FIXED: Finish and open - with state check
        function finishAndOpen() {
            console.log('🏁 finishAndOpen called, pendingUrl:', pendingUrl);
            
            // Clear timer
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            
            // Hide popup
            adPopup.classList.remove('show');
            
            // Open file if URL exists
            if (pendingUrl) {
                const urlToOpen = pendingUrl;
                pendingUrl = null; // Clear before opening
                openFile(urlToOpen);
            } else {
                console.error('❌ No pending URL to open!');
                showToast('Error: No file to open');
            }
        }

        function showAdPopup(url) {
            console.log('📢 Showing ad popup for:', url);
            pendingUrl = url;
            
            // Show popup
            adPopup.classList.add('show');
            
            // Try to show Adsgram ad
            if (AdController) {
                AdController.show().catch(err => console.log('Ad error (ignored):', err));
            }
            
            // Reset and start countdown
            let seconds = 5;
            adTimer.textContent = seconds;
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                seconds--;
                adTimer.textContent = seconds;
                console.log('⏰ Countdown:', seconds);
                
                if (seconds <= 0) {
                    console.log('✅ Countdown finished, opening file');
                    finishAndOpen();
                }
            }, 1000);
        }

        // Skip button
        skipAdBtn.addEventListener('click', () => {
            console.log('⏭️ Skip button clicked');
            finishAndOpen();
        });

        async function loadAllData() {
            try {
                const [slidersSnap, filesSnap] = await Promise.all([
                    getDocs(query(collection(db, "sliders"), orderBy("createdAt", "desc"), limit(10))),
                    getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"), limit(50)))
                ]);
                
                renderSliders(slidersSnap);
                renderFiles(filesSnap);
            } catch (error) {
                console.error("Error loading:", error);
                sliderWrapper.innerHTML = `<div class="slider-item flex items-center justify-center bg-red-100"><p class="text-red-600">Could not load slides.</p></div>`;
                filesGrid.innerHTML = `<p class="col-span-full text-center text-red-500">Could not load files.</p>`;
            }
        }

        function renderSliders(sliderSnapshot) {
            sliderWrapper.innerHTML = '';
            sliderDotsContainer.innerHTML = '';
            const slides = [];
            sliderSnapshot.forEach(doc => slides.push(doc.data()));
            
            if (slides.length > 0) {
                slides.forEach((slide, index) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = 'slider-item';
                    slideEl.innerHTML = slide.linkUrl ? 
                        `<a href="${slide.linkUrl}" target="_blank"><img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1280x400'"></a>` :
                        `<img src="${slide.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1280x400'">`;
                    sliderWrapper.appendChild(slideEl);
                    
                    const dotEl = document.createElement('div');
                    dotEl.className = 'slider-dot';
                    dotEl.dataset.index = index;
                    sliderDotsContainer.appendChild(dotEl);
                });
                setupSlider(slides.length);
            }
        }

        function renderFiles(filesSnapshot) {
            filesGrid.innerHTML = '';
            allFiles = [];
            
            if (filesSnapshot.empty) {
                filesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No files available.</p>`;
                return;
            }
            
            filesSnapshot.forEach(doc => {
                const data = doc.data();
                console.log('📁 File loaded:', data.title, data.downloadUrl);
                allFiles.push({ id: doc.id, ...data });
            });
            
            allFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow';
                card.dataset.title = file.title.toLowerCase();
                card.dataset.description = (file.description || '').toLowerCase();
                
                card.innerHTML = `
                    <img src="${file.thumbnailUrl}" alt="${file.title}" class="w-full aspect-video object-cover" onerror="this.src='https://placehold.co/400x225'">
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-gray-900 truncate">${file.title}</h3>
                        <p class="text-gray-600 text-sm mt-1 h-10 overflow-hidden">${file.description || ''}</p>
                        <div class="mt-3">
                            <button data-url="${file.downloadUrl}" class="access-btn w-full py-2.5 px-4 rounded-lg text-white font-semibold bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 flex items-center justify-center gap-2">
                                <i class="fas fa-play-circle"></i>
                                <span>Access Now</span>
                            </button>
                        </div>
                    </div>
                `;
                filesGrid.appendChild(card);
            });
        }

        function setupSlider(slideCount) {
            if (slideCount <= 1) {
                if(slideCount === 1) document.querySelector('.slider-dot')?.classList.add('active');
                return;
            }
            const dots = document.querySelectorAll('.slider-dot');
            function goToSlide(index) {
                currentSlide = (index + slideCount) % slideCount;
                sliderWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach(dot => dot.classList.remove('active'));
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => goToSlide(currentSlide + 1), 3000);
            dots.forEach(dot => dot.addEventListener('click', (e) => goToSlide(parseInt(e.target.dataset.index))));
            goToSlide(0);
        }

        function handleSearch() {
            const term = searchInput.value.toLowerCase();
            let visible = 0;
            
            document.querySelectorAll('.file-card').forEach(card => {
                const title = card.dataset.title;
                const desc = card.dataset.description;
                if (title.includes(term) || desc.includes(term)) {
                    card.style.display = 'block';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            noResultsMessage.style.display = visible === 0 ? 'block' : 'none';
        }

        // Handle click
        filesGrid.addEventListener('click', (e) => {
            const accessBtn = e.target.closest('.access-btn');
            if (accessBtn) {
                const url = accessBtn.dataset.url;
                console.log('🖱️ Access button clicked, URL:', url);
                showAdPopup(url);
            }
        });

        searchInput.addEventListener('input', handleSearch);

        // Start
        loadAllData();
        setTimeout(initAdsgram, 1000);
        
        // Debug: Check if Firebase data has downloadUrl
        console.log('🔥 App started. Check console for logs.');
    </script>
</body>
</html>
